<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCRES - Constable Mock Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#eef2ff;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:14px}
.top-card{background:linear-gradient(135deg,#6d22d8 0%,#2a74ef 100%);border-radius:24px;padding:18px 20px 22px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(70,20,180,.25)}
.badge{position:absolute;top:14px;right:14px;background:linear-gradient(135deg,#ff4b4b,#ff6a3d);color:#fff;font-size:11px;padding:7px 12px;border-radius:20px;font-weight:700;box-shadow:0 4px 12px rgba(255,75,75,.4)}
.logo-row{display:flex;align-items:center;gap:12px;margin-top:32px}
.logo{width:46px;height:46px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#6d22d8;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.top-card h2{color:#fff;font-size:17px;line-height:1.35;font-weight:800}
.main-card{background:#fff;border-radius:22px;margin-top:-12px;padding:20px 16px;box-shadow:0 12px 30px rgba(0,0,0,.08);position:relative;z-index:2}
.main-card h3{color:#0f1f4a;font-size:20px;font-weight:900}
.main-card p.sub{color:#5b6b8a;font-size:12px;margin-top:6px}
.label{margin-top:16px;color:#0f1f4a;font-weight:800;font-size:13px}
.input-box{margin-top:8px;background:#f3f4f8;border:1.5px solid #d9deea;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.input-box input{border:none;background:transparent;outline:none;width:100%;font-size:14px;color:#1a2b4c}
.btn{margin-top:16px;width:100%;background:linear-gradient(135deg,#6d22d8 0%,#2a74ef 100%);color:#fff;border:none;padding:14px;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(70,20,180,.25)}
.btn:active{transform:scale(.98)}
.timer{position:fixed;top:76px;right:12px;background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff;padding:8px 14px;border-radius:20px;font-weight:800;z-index:99;display:none;box-shadow:0 4px 12px rgba(255,65,108,.4)}
.opt{border:2px solid #e8e8ff;border-radius:12px;padding:11px 12px;margin:9px 0;cursor:pointer;background:#fafaff;font-size:14px;line-height:1.3}
.opt.selected{border-color:#6a11cb;background:#e9d6ff;font-weight:600}
.opt.correct{background:#e8f5e9!important;border-color:#2e7d32!important}
.opt.wrong{background:#ffebee!important;border-color:#d32f2f!important}
.exp{background:#fff8e1;border-left:4px solid #ffb300;padding:10px 12px;border-radius:8px;margin-top:8px;font-size:13px;display:none;line-height:1.4}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 20px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-card">
    <div class="badge" id="topTimer">⏱ 25:00 మిగిలి ఉంది</div>
    <div class="logo-row"><div class="logo">M</div><div><h2>MCRES - Constable<br>GS Mock Test 01</h2></div></div>
  </div>

  <div class="main-card" id="startScreen">
    <h3>MCRES - ఉచిత మాక్ టెస్ట్</h3>
    <p class="sub">మీ పేరు నమోదు చేసి పరీక్షను ప్రారంభించండి</p>

    <!-- Categories - FINAL LOCKED: కానిస్టేబుల్/SI | Group 1,2,3,4 | DSC -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px">
      <div style="background:#e8e4ff;border-radius:16px;padding:12px;text-align:center">
        <div style="font-size:24px">🛡️</div>
        <div style="font-weight:800;font-size:10px;margin-top:4px;color:#4a2d8a;line-height:1.2">కానిస్టేబుల్<br>/SI</div>
      </div>
      <div style="background:#dbe6ff;border-radius:16px;padding:12px;text-align:center;border:2px solid #6a11cb">
        <div style="font-size:24px">🏛️</div>
        <div style="font-weight:800;font-size:10px;margin-top:4px;color:#1a3d8a;line-height:1.2">Group<br>1,2,3,4</div>
      </div>
      <div style="background:#f0e6ff;border-radius:16px;padding:12px;text-align:center">
        <div style="font-size:24px">📚</div>
        <div style="font-weight:800;font-size:10px;margin-top:4px;color:#4a2d8a;line-height:1.2">DSC</div>
      </div>
    </div>

    <div class="label">పేరు / Name</div>
    <div class="input-box"><span>👤</span><input id="sName" placeholder="మీ పేరు నమోదు చేయండి"></div>
    <button class="btn" onclick="startTest()">పరీక్ష ప్రారంభించండి →</button>
    <div style="margin-top:12px;display:flex;gap:10px;color:#6b7a90;font-size:10px"><span>☰ 25 ప్రశ్నలు</span><span>🕒 25 నిమి</span><span>🛡 ఉచితం</span></div>
  </div>

  <div id="quizBox" style="display:none"></div>
  <div id="resultBox" class="card" style="display:none"></div>
</div>

<div class="timer" id="timer">⏱ 25:00</div>

<script>
const questions=[
{q:"తెలంగాణ రాష్ట్రం ఏర్పడిన తేదీ?",o:["2 జూన్ 2014","1 జూన్ 2014","2 జూన్ 2013","15 ఆగస్టు 2014"],a:0,e:"2 జూన్ 2014న 29వ రాష్ట్రంగా ఏర్పడింది."},
{q:"గోల్కొండ కోటను మొదట నిర్మించినవారు?",o:["కుతుబ్ షాహీలు","కాకతీయులు","చాళుక్యులు","ముసునూరి నాయకులు"],a:1,e:"11వ శతాబ్దంలో కాకతీయ రాజు ప్రోలరాజు నిర్మించారు."},
{q:"తెలంగాణలో అతి పొడవైన నది?",o:["కృష్ణా","గోదావరి","మూసీ","మంజీరా"],a:1,e:"గోదావరి తెలంగాణలో 700+ కి.మీ ప్రవహిస్తుంది."},
{q:"రామప్ప ఆలయం ఏ జిల్లాలో ఉంది?",o:["వరంగల్","ములుగు","భూపాలపల్లి","హనుమకొండ"],a:1,e:"ములుగు జిల్లాలో ఉంది, UNESCO World Heritage Site."},
{q:"తెలంగాణ తొలి ముఖ్యమంత్రి ఎవరు?",o:["కె. చంద్రశేఖర్ రావు","రేవంత్ రెడ్డి","ఈటల రాజేందర్","కడియం శ్రీహరి"],a:0,e:"కెసిఆర్ తొలి ముఖ్యమంత్రి (2014-2023)."},
{q:"బతుకమ్మ పండుగ ఎన్ని రోజులు జరుపుకుంటారు?",o:["7 రోజులు","9 రోజులు","5 రోజులు","10 రోజులు"],a:1,e:"9 రోజులు, దుర్గా నవరాత్రులలో జరుపుకుంటారు."},
{q:"తెలంగాణ అధికార భాష?",o:["తెలుగు, ఉర్దూ","తెలుగు మాత్రమే","హిందీ","తెలుగు, ఇంగ్లీష్"],a:0,e:"తెలుగు, ఉర్దూ అధికార భాషలు."},
{q:"చార్మినార్ ను ఎవరు నిర్మించారు?",o:["కులీ కుతుబ్ షా","మహ్మద్ కులీ కుతుబ్ షా","ఔరంగజేబు","నిజాం"],a:1,e:"1591లో మహ్మద్ కులీ కుతుబ్ షా నిర్మించారు."},
{q:"తెలంగాణ రాష్ట్ర చిహ్నంలో ఏముంది?",o:["చార్మినార్, కాకతీయ కళాతోరణం","గోల్కొండ కోట","వరంగల్ కోట","బుద్ధ విగ్రహం"],a:0,e:"చార్మినార్ మరియు కాకతీయ కళాతోరణం."},
{q:"పోచంపల్లి ఏ జిల్లాలో ప్రసిద్ధి?",o:["యాదాద్రి-భువనగిరి","సూర్యాపేట","నల్గొండ","రంగారెడ్డి"],a:0,e:"యాదాద్రి-భువనగిరి జిల్లా, ఇక్కత్ చీరలకు ప్రసిద్ధి."}
];
let answers={},timeLeft=1500,timerInt;
function startTest(){let name=document.getElementById('sName').value.trim();if(!name){alert('దయచేసి పేరు నమోదు చేయండి');return}document.getElementById('startScreen').style.display='none';document.getElementById('quizBox').style.display='block';document.getElementById('timer').style.display='block';renderQuiz();timerInt=setInterval(()=>{timeLeft--;let m=Math.floor(timeLeft/60),s=timeLeft%60;let t=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;document.getElementById('timer').innerText=`⏱ ${t}`;document.getElementById('topTimer').innerText=`⏱ ${m}:${s.toString().padStart(2,'0')} మిగిలి ఉంది`;if(timeLeft<=0){clearInterval(timerInt);submitTest()}},1000)}
function renderQuiz(){let html='';questions.forEach((q,i)=>{html+=`<div class="card"><div style="font-weight:700;font-size:14px">Q${i+1}. ${q.q}</div>`;q.o.forEach((opt,j)=>{html+=`<div class="opt" onclick="selectOpt(${i},${j})" id="q${i}o${j}">${String.fromCharCode(65+j)}. ${opt}</div>`});html+=`<div class="exp" id="exp${i}"><b>💡 వివరణ:</b> ${q.e}</div></div>`});html+=`<div class="card"><button class="btn" onclick="submitTest()">✅ Submit చేయండి</button></div>`;document.getElementById('quizBox').innerHTML=html}
function selectOpt(qi,oi){answers[qi]=oi;for(let j=0;j<4;j++){let el=document.getElementById(`q${qi}o${j}`);if(el)el.classList.remove('selected')}document.getElementById(`q${qi}o${oi}`).classList.add('selected')}
function submitTest(){clearInterval(timerInt);let score=0;questions.forEach((q,i)=>{let exp=document.getElementById(`exp${i}`);if(exp)exp.style.display='block';let correct=q.a;let chosen=answers[i];for(let j=0;j<4;j++){let el=document.getElementById(`q${i}o${j}`);if(!el)continue;if(j===correct)el.classList.add('correct');if(chosen!==undefined&&j===chosen&&chosen!==correct)el.classList.add('wrong')}if(chosen===correct)score++});let qb=document.getElementById('quizBox');qb.style.opacity='.7';qb.style.pointerEvents='none';let rBox=document.getElementById('resultBox');rBox.style.display='block';let perc=Math.round((score/questions.length)*100);rBox.innerHTML=`<div style="text-align:center;font-weight:800;color:#6a11cb">🎉 మీ ఫలితం</div><div style="text-align:center;font-size:36px;font-weight:900;color:#6a11cb;margin:8px 0">${score}/${questions.length}</div><div style="text-align:center;font-size:14px">${perc}% - ${perc>=50?'🌟 ఉత్తీర్ణత!':'💪 మరింత సాధన అవసరం'}</div><button class="btn" style="margin-top:14px" onclick="location.reload()">🔄 మళ్లీ ప్రయత్నించండి</button>`;window.scrollTo({top:0,behavior:'smooth'})}
</script>
</body>
</html>
