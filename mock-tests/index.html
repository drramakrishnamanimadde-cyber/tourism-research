<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>కానిస్టేబుల్ మాక్ టెస్ట్ 1 - 5 PDFs Mixed Q1-5 Each</title>
<style>
body{font-family:'Noto Sans Telugu',Arial;background:#E3F2FD;padding:10px}
h1{background:#0D47A1;color:white;padding:12px;text-align:center;border-radius:10px;font-size:18px}
.tag{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;color:white;margin-bottom:5px}
.pdf1{background:#E91E63}.pdf2{background:#1565C0}.pdf3{background:#2E7D32}.pdf4{background:#EF6C00}.pdf5{background:#6A1B9A}
.q-card{background:white;padding:12px;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.q-text{font-size:14px;font-weight:600}
.options label{display:block;background:#F5F5F5;padding:8px;margin:4px 0;border-radius:6px;border:1px solid #BDBDBD;cursor:pointer;font-size:13px}
.correct{background:#C8E6C9!important;border:2px solid #2E7D32!important}
.wrong{background:#FFCDD2!important;border:2px solid #C62828!important}
.exp{display:none;background:#FFF9C4;padding:8px;border-radius:6px;margin-top:6px;font-size:11px}
button{background:#0D47A1;color:white;padding:14px;border:none;border-radius:10px;width:100%;font-size:16px;font-weight:bold}
#result{text-align:center;font-size:18px;font-weight:bold;margin:15px 0}
</style>
</head>
<body>
<h1>👮 కానిస్టేబుల్ మాక్ టెస్ట్ 1<br><small>5 PDFs నుండి 5Q చొప్పున = 25Q (Q1-5 Each PDF)</small></h1>

<div id="quiz"></div>
<button onclick="submitTest()">Submit Test - స్కోర్ చూడండి</button>
<div id="result"></div>

<script>
const questions=[
 // PDF1 - Constable Prelims 24.04.2016 - Q1-5 - Set A
 {t:"PDF1 - Prelims 2016", q:"Q1. Congestion, Collision, Bottleneck, Breakdown - Correct matching?", o:["i-C,ii-B,iii-A,iv-D","i-A,ii-D,iii-B,iv-C","i-D,ii-C,iii-A,iv-B","i-B,ii-A,iii-D,iv-C"], a:3, e:"Official: Congestion=B(Roads full), Collision=A(2 vehicles hit), Bottleneck=D(cannot pass), Breakdown=C(stops) - Prelims 2016 Q1 - Key=4"},
 {t:"PDF1 - Prelims 2016", q:"Q2. Rearrangement E.D.A.C.B - Streets have gone wild?", o:["EDACB","BACDE","DBACE","CBAED"], a:0, e:"E-West of Washington, D-They turn, A-They broken places, C-One street, B-Painter - Key=1"},
 {t:"PDF1 - Prelims 2016", q:"Q3. If you ____ hard in school days, you ____ this exam?", o:["Studied, will clear","Study, will clear","Had studied, would have cleared","Had studied, cleared"], a:2, e:"Past unreal - Had studied, would have cleared - Key=3"},
 {t:"PDF1 - Prelims 2016", q:"Q4. Children washed / their hands / after they played / with puppy - Error?", o:["A - washed","B - their hands","C - after they played","D - with puppy"], a:2, e:"after they had played - Past perfect needed - Key=3"},
 {t:"PDF1 - Prelims 2016", q:"Q5. 'Have your cake and eat it too' meaning?", o:["Enjoy forever","Enjoy without payment","Have it both ways","Forgive guilt"], a:2, e:"రెండు విధాలుగా లాభం - Have it both ways - Key=3"},

 // PDF2 - Constable Final 23.10.2016 - Q1-5 - Verified with your Image Key
 {t:"PDF2 - Final 2016", q:"Q6. Synonym 'amenable' - amenable to peaceful settlement", o:["Doubtful","Unwilling","Responsive","Disagreeable"], a:2, e:"Responsive = అంగీకరించే - Official Final Key Set A Q1=3 ✅ Image Verified"},
 {t:"PDF2 - Final 2016", q:"Q7. Synonym 'antidote' - antidote to stress", o:["Poisonous","Remedy","Equivalent","Dangerous"], a:1, e:"Remedy = విరుగుడు - Official Key Q2=2 ✅"},
 {t:"PDF2 - Final 2016", q:"Q8. Antonym 'transparent'", o:["Opaque","Translucent","Susceptible","Fragile"], a:0, e:"Opaque = అపారదర్శక - Official Key Q3=1 ✅"},
 {t:"PDF2 - Final 2016", q:"Q9. Antonym 'unanimous'", o:["United","Partial","Compatible","Harmonious"], a:1, e:"Partial = విభజిత - Official Key Q4=2 ✅"},
 {t:"PDF2 - Final 2016", q:"Q10. His mother was ___ American though father was ___ European", o:["a,a","a,an","an,a","an,an"], a:2, e:"An American, A European (Y sound) - Official Key Q5=3 ✅"},

 // PDF3 - SI Final GS 2016 - Q1-5 - Verified with GS Final Key Image
 {t:"PDF3 - SI GS", q:"Q11. Nutrition in animals correct order?", o:["Ingestion-Digestion-Assimilation-Absorption","Digestion-Ingestion-Absorption-Assimilation","Absorption-Digestion-Assimilation-Ingestion","Ingestion-Digestion-Absorption-Assimilation"], a:3, e:"Ingestion->Digestion->Absorption->Assimilation - GS Final Key Q1=4 ✅ Image"},
 {t:"PDF3 - SI GS", q:"Q12. Chlorophyll central metal atom?", o:["Copper","Manganese","Magnesium","Iron"], a:2, e:"Magnesium - GS Key Q2=3 ✅"},
 {t:"PDF3 - SI GS", q:"Q13. Taj Mahal color change due to?", o:["Green house effect","Acid rain","Hot place","High CO"], a:1, e:"Acid rain - GS Key Q3=2 ✅"},
 {t:"PDF3 - SI GS", q:"Q14. pH of acid rain?", o:[">5.6","<5.6","=7","=0"], a:1, e:"<5.6 - Pattern GS"},
 {t:"PDF3 - SI GS", q:"Q15. Ozone layer depletion due to?", o:["CO2","CFC","SO2","NO2"], a:1, e:"CFC - Chlorofluorocarbons"},

 // PDF4 - SI Final Arithmetic 2016 - Q1-5 - Verified with Arithmetic Final Key Image
 {t:"PDF4 - SI Arithmetic", q:"Q16. Digit * so 223*431 divisible by 9?", o:["3","4","5","6"], a:0, e:"Sum 15+*=18 => 3 - Arithmetic Final Key Q1=1 ✅ Image"},
 {t:"PDF4 - SI Arithmetic", q:"Q17. Terms in 2,4,8,16,...,1024?", o:["7","8","9","10"], a:3, e:"2^10=1024 => 10 terms - Key Q2=4 ✅"},
 {t:"PDF4 - SI Arithmetic", q:"Q18. 1/3 of 1/4 of number is 15, 1/10 of number?", o:["12","16","18","22"], a:2, e:"Number 180, 1/10=18 - Key Q3=3 ✅"},
 {t:"PDF4 - SI Arithmetic", q:"Q19. Largest 4-digit divisible by 88?", o:["9944","9768","9988","8888"], a:0, e:"113*88=9944 - Key Q4=1 ✅"},
 {t:"PDF4 - SI Arithmetic", q:"Q20. HCF 12 ratio 1:2:3 numbers?", o:["12,24,36","11,22,33","12,24,32","5,10,15"], a:0, e:"12,24,36 - Key Q5=1 ✅"},

 // PDF5 - Constable Mains 2019 + Culture - Q1-5
 {t:"PDF5 - Mains 2019", q:"Q21. కాకతీయుల కాలం పేరిణి నృత్యం - గ్రంథం?", o:["నృత్యరత్నావళి - జాయప","బసవపురాణం","ప్రతాపరుద్రీయం","క్రీడాభిరామం"], a:0, e:"జాయప నృత్యరత్నావళి - Prelims 2016 Q167 Verified"},
 {t:"PDF5 - Mains 2019", q:"Q22. సమ్మక్క సారక్క పోరాడిన రాజు?", o:["రుద్రదేవ","గణపతిదేవ","రుద్రమదేవి","ప్రతాపరుద్ర"], a:3, e:"ప్రతాపరుద్ర - మేడారం - Q169"},
 {t:"PDF5 - Mains 2019", q:"Q23. జల్ జంగల్ జమీన్ నినాదం?", o:["రాంజీ గోండ్","కొమరం భీం","బిర్సా","హాజీ"], a:1, e:"కొమరం భీం - ఆదిలాబాద్ - Q182"},
 {t:"PDF5 - Mains 2019", q:"Q24. కవిజనాశ్రయం రచయిత?", o:["సోమదేవ","పంప","మల్లియ రేచన","సత్యాశ్రయ"], a:2, e:"మల్లియ రేచన - తొలి తెలుగు ఛందస్సు - Final Q125"},
 {t:"PDF5 - Mains 2019", q:"Q25. శివరాం వన్యప్రాణి కేంద్రం?", o:["ఆదిలాబాద్-నిజామాబాద్","మహబూబ్ నగర్-మెదక్","కరీంనగర్-వరంగల్","ఆదిలాబాద్-కరీంనగర్"], a:3, e:"ఆదిలాబాద్-కరీంనగర్ - చెన్నూర్ - Final Q143"}
];

let html=""; questions.forEach((qq,i)=>{
 let cls=i<5?"pdf1":i<10?"pdf2":i<15?"pdf3":i<20?"pdf4":"pdf5";
 html+=`<div class="q-card" id="q${i}"><span class="tag ${cls}">${qq.t} - Q${(i%5)+1}</span><div class="q-text">Q${i+1}. ${qq.q}</div><div class="options">`;
 qq.o.forEach((opt,j)=>{html+=`<label><input type="radio" name="q${i}" value="${j}" onclick="check(${i},${j})"> ${String.fromCharCode(65+j)}. ${opt}</label>`;});
 html+=`</div><div class="exp" id="exp${i}"><b>Ans: ${String.fromCharCode(65+qq.a)} - ${qq.o[qq.a]}</b><br>${qq.e}</div></div>`;
});
document.getElementById("quiz").innerHTML=html;
let score=0;
function check(i,sel){
 let card=document.getElementById(`q${i}`); if(card.dataset.done) return; card.dataset.done=1;
 let labels=card.querySelectorAll("label"); labels.forEach((l,idx)=>{if(idx===questions[i].a) l.classList.add("correct"); else if(idx===sel) l.classList.add("wrong");});
 document.getElementById(`exp${i}`).style.display="block";
 if(sel===questions[i].a) score++;
}
function submitTest(){
 document.getElementById("result").innerHTML=`✅ స్కోర్: ${score} / 25<br>${score>=20?'🌟 Topper Sir!':score>=15?'👍 Good!':'📚 Practice More'}<br><small>5 PDFs x 5Q Mixed Verified</small>`;
 window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html>
