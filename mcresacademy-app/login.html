<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MCRES ACADEMY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{background:linear-gradient(135deg,#a02ab0,#4737ed);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;width:100%;max-width:380px;padding:24px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.card img{width:110px;border-radius:12px}
.card h1{color:#670f9e;font-size:22px;margin:8px 0 2px}
.card p{font-size:14px;color:#555;margin-bottom:18px}
input{width:100%;padding:13px;border:2px solid #eee;border-radius:12px;margin-bottom:12px;font-size:15px;outline:none}
input:focus{border-color:#670f9e}
.btn{width:100%;background:#ff8703;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:16px}
.btn2{width:100%;background:#f1f1f1;color:#111;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:15px;margin-top:10px}
a{color:#670f9e;text-decoration:none;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="card">
<img src="IMG-20261118-WA0009.jpg" alt="MCRES">
<h1>MCRES ACADEMY</h1>
<p>Welcome Back! Login to Continue Tests</p>
<input type="text" id="name" placeholder="👤 Your Name">
<input type="tel" id="phone" placeholder="📱 Mobile Number - 10 Digits">
<button class="btn" onclick="login()">Login →</button>
<button class="btn2" onclick="location.href='index.html'">Continue as Guest</button>
<p style="margin-top:16px"><a href="index.html">← Back to Home</a></p>
</div>
<script>
function login(){
let n=document.getElementById("name").value;
let p=document.getElementById("phone").value;
if(n.trim()=="" || p.trim()==""){alert("Please Enter Name & Mobile Number");return;}
localStorage.setItem("mcres_name",n);
localStorage.setItem("mcres_phone",p);
alert("Welcome "+n+"! Login Successful 🎉");
location.href="index.html";
}
</script>
</body>
</html>
