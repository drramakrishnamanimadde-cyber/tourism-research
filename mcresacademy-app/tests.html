<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Series - MCRES ACADEMY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial,sans-serif}
body{background:#f5f0ff;padding:16px;padding-bottom:40px;color:#222}
.top{max-width:480px;margin:0 auto;text-align:center;padding:14px 10px 8px}
.top h1{color:#670f9e;font-size:24px;letter-spacing:.3px;line-height:1.2}
.top .sub{font-size:13px;color:#666;margin-top:4px;font-weight:600}
.top .tag{font-size:12px;color:#888;margin-top:2px}
.search{max-width:480px;margin:12px auto 4px}
.search input{width:100%;padding:13px 16px;border:1px solid #e5d5f5;border-radius:14px;font-size:15px;background:#fff;outline:none}
.search input:focus{border-color:#670f9e}
.card{max-width:480px;margin:12px auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.06);display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.card:active{transform:scale(.98)}
.card.disabled{opacity:.65;cursor:not-allowed}
.num{width:38px;height:38px;min-width:38px;border-radius:11px;background:#670f9e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.card h2{font-size:15.5px;line-height:1.35;color:#1a1a1a;font-weight:700;word-break:break-word}
.card p{font-size:12.5px;color:#666;margin-top:4px;line-height:1.4}
.view{margin-left:auto;background:#ff8703;color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.view.soon{background:#999}
.view.paid{background:#670f9e}
.back{display:block;text-align:center;margin:16px auto;max-width:480px;color:#670f9e;font-weight:700;background:#fff;padding:13px;border-radius:12px;cursor:pointer;border:1px solid #e5d5f5}
.c1{background:#38bdf8}.c2{background:#34d399}.c3{background:#fbbf24}.c4{background:#a78bfa}.c5{background:#f472b6}.c6{background:#fb923c}.c7{background:#4ade80}.c8{background:#facc15}.c9{background:#60a5fa}.c10{background:#f87171}.c11{background:#a78bfa}
.badge{display:inline-block;background:#fff3e0;color:#e65100;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:6px}
.badge.soon{background:#f1f1f1;color:#666}
.empty{max-width:480px;margin:20px auto;text-align:center;color:#888;font-size:14px;background:#fff;padding:20px;border-radius:14px}
</style>
</head>
<body>
<div class="top">
<h1>MCRES ACADEMY</h1>
<div class="sub">Online Test Series & Assessment Platform</div>
<div class="tag">Telangana • Recruitment Focused • Mobile Friendly</div>
</div>

<div class="search"><input id="searchInput" placeholder="🔍 Search - Ex: Police, Group-I, TET..." oninput="onSearch(this.value)"></div>

<div id="list"></div>
<div class="back" id="backBtn" style="display:none">← Back</div>

<script>
const colors=["c1","c2","c3","c4","c5","c6","c7","c8","c9","c10","c11"];
const categories=[
{id:"cat-01",name:"TG Current Affairs - Daily",desc:"Daily • 25 Questions"},
{id:"cat-02",name:"TGPSC General Studies - Test Series",desc:"GS • Grand + Chapter Wise"},
{id:"cat-03",name:"TGPSC Group I, II, III & IV - Test Series",desc:"Group Exams • 150 Questions"},
{id:"cat-04",name:"TG Police Recruitment - Test Series",desc:"Constable / SI • 200 Questions"},
{id:"cat-05",name:"TG TET / DSC / Gurukul - Test Series",desc:"Teaching Exams • 25 Questions"},
{id:"cat-06",name:"JL / DL - Test Series",desc:"Junior & Degree Lecturer • 25 Questions"},
{id:"cat-07",name:"RRB / SSC - Test Series",desc:"Central Govt Exams • 25 Questions"},
{id:"cat-08",name:"UGC NET - Geography Test Series",desc:"Geography • 25 Questions"},
{id:"cat-09",name:"CSIR NET - Earth Science Test Series",desc:"Earth Sciences • 25 Questions"},
{id:"cat-10",name:"SET - Subject wise Test Series",desc:"State Eligibility Test • 25 Questions"},
{id:"cat-11",name:"TGPSC Group-I - Mains Descriptive Notes",desc:"Mains Notes"},
];
const subs={
"cat-01":[{id:"sub-101",name:"Daily Current Affairs",desc:"25 Questions • 25 Marks"}],
"cat-02":[{id:"sub-201",name:"General Studies Grand Tests",desc:"150 Questions • 150 Marks"},{id:"sub-202",name:"General Studies Chapter Wise",desc:"25 Questions • 25 Marks"}],
"cat-03":[{id:"sub-301",name:"Group-I Prelims",desc:"150 Questions • 150 Marks"},{id:"sub-302",name:"Group-II Tests",desc:"150 Questions • 150 Marks"},{id:"sub-303",name:"Group-III Tests",desc:"150 Questions • 150 Marks"},{id:"sub-304",name:"Group-IV Tests",desc:"150 Questions • 150 Marks"}],
"cat-04":[{id:"sub-401",name:"Constable Prelims",desc:"200 Questions • 200 Marks"},{id:"sub-402",name:"Constable Grand Tests",desc:"6 Full Syllabus Tests • 200Q"},{id:"sub-403",name:"Constable Chapter Wise Tests",desc:"60 Chapter Wise Tests • 25Q"},{id:"sub-404",name:"SI Tests",desc:"Sub-Inspector • 200 Questions"}],
"cat-05":[{id:"sub-501",name:"TET Tests",desc:"25 Questions • 25 Marks"},{id:"sub-502",name:"DSC Tests",desc:"25 Questions • 25 Marks"},{id:"sub-503",name:"Gurukul Tests",desc:"25 Questions • 25 Marks"}],
"cat-06":[{id:"sub-601",name:"JL Tests",desc:"25 Questions • 25 Marks"},{id:"sub-602",name:"DL Tests",desc:"25 Questions • 25 Marks"}],
"cat-07":[{id:"sub-701",name:"RRB Tests",desc:"25 Questions • 25 Marks"},{id:"sub-702",name:"SSC Tests",desc:"25 Questions • 25 Marks"}],
"cat-08":[{id:"sub-801",name:"UGC NET Geography",desc:"25 Questions • 25 Marks"}],
"cat-09":[{id:"sub-901",name:"CSIR NET Earth Science",desc:"25 Questions • 25 Marks"}],
"cat-10":[{id:"sub-1001",name:"SET Subject Wise",desc:"25 Questions • 25 Marks"}],
"cat-11":[{id:"sub-1101",name:"Mains Descriptive Notes",desc:"Notes"}],
};
const testsData={
"sub-402":[
{id:"test-401",name:"Grand Test - 1",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"},
{id:"test-402",name:"Grand Test - 2",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"},
{id:"test-403",name:"Grand Test - 3",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"},
{id:"test-404",name:"Grand Test - 4",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"},
{id:"test-405",name:"Grand Test - 5",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"},
{id:"test-406",name:"Grand Test - 6",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"},
],
"sub-404":[
{id:"test-411",name:"SI Grand Test - 1",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"},
{id:"test-412",name:"SI Grand Test - 2",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"},
],
"sub-401":[{id:"test-410",name:"Constable Prelims Test - 1",desc:"200 Questions • 200 Marks • Negative -0.25",status:"paid"}],
"sub-301":[{id:"test-301",name:"Group-I Prelims Test - 1",desc:"150 Questions • 150 Marks • No Negative",status:"paid"}],
"sub-302":[{id:"test-302",name:"Group-II Test - 1",desc:"150 Questions • 150 Marks • No Negative",status:"paid"}],
"sub-101":[{id:"test-101",name:"Current Affairs - Nov 2026",desc:"25 Questions • 25 Marks • No Negative",status:"paid"}],
"sub-501":[{id:"test-501",name:"TET Test - 1",desc:"25 Questions • 25 Marks • No Negative",status:"paid"}],
};
let view="cats", curCat=null, curSub=null, curSubName="", searchText="";
function onSearch(v){searchText=v.toLowerCase().trim(); render();}
function render(){
let list=document.getElementById("list");
let back=document.getElementById("backBtn");
let h="";
if(view=="cats"){
back.style.display="none";
let filtered=categories.filter(c=>c.name.toLowerCase().includes(searchText));
if(filtered.length==0){h=`<div class="empty">No results for "${searchText}"</div>`;}
filtered.forEach((c)=>{
let i=categories.indexOf(c);
h+=`<div class="card" onclick="openCat('${c.id}')"><div class="num ${colors[i]}">${i+1}</div><div><h2>${c.name}</h2><p>${c.desc}</p></div><span class="view">View →</span></div>`;
});
}else if(view=="subs"){
back.style.display="block"; back.textContent="← Back to Categories";
let arr=(subs[curCat]||[]).filter(s=>s.name.toLowerCase().includes(searchText));
if(arr.length==0) h=`<div class="empty">No results found</div>`;
arr.forEach((s,i)=>{h+=`<div class="card" onclick="openSub('${s.id}','${s.name}')"><div class="num ${colors[i]}">📚</div><div><h2>${s.name}</h2><p>${s.desc}</p></div><span class="view">View →</span></div>`;});
}else{
back.style.display="block"; back.textContent="← Back";
let arr=(testsData[curSub]||[]).filter(t=>t.name.toLowerCase().includes(searchText));
if(arr.length==0){h+=`<div class="card disabled"><div class="num">⏳</div><div><h2>Coming Soon</h2><p>Tests will be added soon by Admin</p></div><span class="view soon">Soon</span></div>`;}
else{arr.forEach((t,i)=>{h+=`<div class="card" onclick="onPaidClick()"><div class="num ${colors[i]}">${i+1}</div><div><h2>${t.name}</h2><p>${t.desc}</p><span class="badge">🔒 PAID TEST</span></div><span class="view paid">Pay →</span></div>`;});}
}
list.innerHTML=h;
}
function openCat(id){curCat=id;view="subs";searchText="";document.getElementById("searchInput").value="";render();}
function openSub(id,name){curSub=id;curSubName=name;view="tests";searchText="";document.getElementById("searchInput").value="";render();}
function onPaidClick(){alert('This is a Paid Test.\nPayment Gateway will be connected soon.\nPlease contact MCRES ACADEMY.');}
document.getElementById("backBtn").addEventListener("click",()=>{
if(view=="tests"){view="subs";render();}
else if(view=="subs"){view="cats";render();}
});
render();
</script>
</body>
</html>
