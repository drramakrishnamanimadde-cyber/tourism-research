<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam - MCRES ACADEMY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{background:#f5f0ff;padding:16px}
.box{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:18px}
h1{color:#670f9e;font-size:19px;text-align:center}
.timer{text-align:center;background:#fff3e0;color:#e65100;padding:8px;border-radius:10px;font-weight:700;margin:12px 0}
.q{margin:16px 0;padding:14px;background:#faf5ff;border-radius:12px}
.q b{font-size:15px}
.opt{display:block;background:#fff;border:2px solid #eee;padding:10px;border-radius:10px;margin-top:8px;cursor:pointer;font-size:14px}
.opt input{margin-right:8px}
.btn{width:100%;background:#ff8703;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:16px;margin-top:16px}
</style>
</head>
<body>
<div class="box">
<h1 id="title">📝 MCRES Test Series</h1>
<div class="timer" id="timer">Time Left: 10:00</div>
<div id="quiz"></div>
<button class="btn" onclick="submitTest()">Submit Test ✅</button>
</div>
<script>
const tests={
1:[{q:"భారతదేశ రాజధాని ఏది?",o:["Mumbai","New Delhi","Kolkata","Chennai"],a:1},{q:"తెలంగాణ ఎప్పుడు ఏర్పడింది?",o:["2012","2013","2014","2015"],a:2},{q:"2 + 2 x 2 = ?",o:["6","8","4","10"],a:0},{q:"Largest Planet?",o:["Mars","Earth","Jupiter","Venus"],a:2},{q:"తెలుగులో 'Water' అంటే?",o:["నీరు","నిప్పు","గాలి","భూమి"],a:0}],
2:[{q:"భారత జాతీయ జంతువు?",o:["Lion","Tiger","Elephant","Peacock"],a:1},{q:"5 x 5 = ?",o:["20","25","30","15"],a:1},{q:"Red Fort ఎక్కడ ఉంది?",o:["Agra","Delhi","Jaipur","Mumbai"],a:1},{q:"తెలంగాణ రాజధాని?",o:["Warangal","Karimnagar","Hyderabad","Nizamabad"],a:2},{q:"Sun rises in?",o:["West","North","East","South"],a:2}],
3:[{q:"India PM ఎవరు?",o:["Rahul Gandhi","Narendra Modi","Amit Shah","Yogi"],a:1},{q:"Telangana CM ఎవరు?",o:["KCR","Revanth Reddy","Bhatti","KTR"],a:1},{q:"T20 World Cup 2026 ఎక్కడ?",o:["India","Australia","England","Pakistan"],a:0},{q:"Hyderabad Metro ఎప్పుడు Start?",o:["2017","2018","2019","2020"],a:0},{q:"ISRO HQ ఎక్కడ?",o:["Delhi","Chennai","Bengaluru","Hyderabad"],a:2}]
};
let params=new URLSearchParams(location.search);
let t=params.get("test")||1;
let qs=tests[t]||tests[1];
document.getElementById("title").innerText="📝 Test Series - Test "+t;
let h="";
qs.forEach((item,i)=>{
h+=`<div class="q"><b>Q${i+1}. ${item.q}</b>`;
item.o.forEach((op,j)=>{h+=`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${op}</label>`});
h+="</div>";
});
document.getElementById("quiz").innerHTML=h;
let sec=600;
setInterval(()=>{sec--;let m=Math.floor(sec/60),s=sec%60;document.getElementById("timer").innerText=`Time Left: ${m}:${s<10?"0"+s:s}`;if(sec<=0) submitTest();},1000);
function submitTest(){
let score=0;qs.forEach((item,i)=>{let sel=document.querySelector(`input[name="q${i}"]:checked`);if(sel && parseInt(sel.value)==item.a) score++;});
localStorage.setItem("mcres_last_score",score+"/"+qs.length);
localStorage.setItem("mcres_last_test","Test "+t);
alert(`Test Completed! Your Score: ${score}/${qs.length} 🎉`);
location.href="results.html";
}
</script>
</body>
</html>
