<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCRES ACADEMY</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#670f9e">
<link rel="apple-touch-icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{
  background:linear-gradient(160deg,#4a1d9e 0%,#6d28d9 35%,#7c3aed 60%,#3b1d8f 100%);
  min-height:100vh;padding:16px;position:relative;overflow-x:hidden;
}
/* 3D Bubbles - Design Only */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.22) 0 45px, transparent 46px),
    radial-gradient(circle at 88% 12%, rgba(255,255,255,.18) 0 70px, transparent 71px),
    radial-gradient(circle at 85% 65%, rgba(255,255,255,.14) 0 55px, transparent 56px),
    radial-gradient(circle at 8% 75%, rgba(255,255,255,.12) 0 65px, transparent 66px),
    radial-gradient(circle at 50% 95%, rgba(255,255,255,.10) 0 90px, transparent 91px);
}
.top{max-width:480px;margin:0 auto;text-align:center;color:#fff;padding:20px 0;position:relative;z-index:1}
.top img{
  width:92px;border-radius:22px;background:#fff;padding:6px;
  box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.9);
}
.top h1{
  font-size:29px;margin:14px 0 4px;letter-spacing:.5px;font-weight:900;
  background:linear-gradient(180deg,#fff700 0%,#ffcf00 35%,#ff8703 70%,#ff5e00 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.20)) drop-shadow(0 8px 14px rgba(0,0,0,.35));
}
.top p{font-size:14px;opacity:.92;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(214,203,255,.88));
  border:1px solid rgba(255,255,255,.85);
  border-radius:22px;padding:20px 18px;margin:14px auto;max-width:480px;
  box-shadow:0 20px 40px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.95);
  position:relative;z-index:1;
}
.card h2{color:#3b147e;font-size:22px;line-height:1.35;margin-bottom:16px;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.btn{
  display:block;text-align:center;
  background:linear-gradient(180deg,#ffb020,#ff8703 55%,#f97316);
  color:#fff;padding:15px;border-radius:16px;font-weight:800;font-size:18px;text-decoration:none;margin-bottom:14px;
  box-shadow:0 8px 18px rgba(255,135,3,.45), inset 0 2px 0 rgba(255,255,255,.65), inset 0 -3px 0 rgba(0,0,0,.08);
  text-shadow:0 1px 2px rgba(0,0,0,.15);
}
.btn:active{transform:translateY(1px)}
.btn2{
  display:block;text-align:center;
  background:linear-gradient(180deg,#ffffff,#e9e7ff);
  color:#111;padding:14px;border-radius:16px;font-weight:700;font-size:17px;text-decoration:none;margin-bottom:12px;
  box-shadow:0 8px 16px rgba(59,20,126,.18), inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.05);
  border:1px solid rgba(255,255,255,.9);
}
.btn2:active{transform:translateY(1px)}
.small{font-size:13px;color:#4a3a65;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="top">
<img src="logo.png" alt="MCRES">
<h1>MCRES ACADEMY</h1>
<p>Telugu Medium • Tests • Practice • Success</p>
</div>
<div class="card">
<h2>Welcome<br>to<br>MCRES ACADEMY 👋</h2>
<a class="btn" href="login.html">Login →</a>
<a class="btn2" href="tests.html">📝 Test Series</a>
<a class="btn2" href="results.html">📊 My Results</a>
<a class="btn2" href="profile.html">👤 My Profile</a>
<p class="small">Guest గా కూడా Test రాయవచ్చు</p>
</div>

<script>
// MCRES Academy - Service Worker Registration
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./sw.js", { scope: "./" })
      .then((reg) => {
        console.log("MCRES SW Registered:", reg.scope);
        // కొత్త Version వస్తే Check చేయి
        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener("statechange", () => {
              if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                console.log("New MCRES version available - reload to update");
              }
            });
          }
        });
      })
      .catch((err) => {
        console.log("MCRES SW Register Failed:", err);
      });
  });
}
</script>
</body>
</html>
