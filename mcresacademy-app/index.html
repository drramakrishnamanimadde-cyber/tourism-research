<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCRES ACADEMY</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#670f9e">
<link rel="apple-touch-icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{background:linear-gradient(135deg,#a02ab0,#4737ed);min-height:100vh;padding:16px}
.top{max-width:480px;margin:0 auto;text-align:center;color:#fff;padding:20px 0}
.top img{width:90px;border-radius:14px;background:#fff;padding:4px}
.top h1{font-size:26px;margin:10px 0 4px}
.top p{font-size:14px;opacity:.9}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px auto;max-width:480px}
.card h2{color:#670f9e;font-size:18px;margin-bottom:10px}
.btn{display:block;text-align:center;background:#ff8703;color:#fff;padding:14px;border-radius:12px;font-weight:700;text-decoration:none;margin-bottom:10px}
.btn2{display:block;text-align:center;background:#f1f1f1;color:#111;padding:13px;border-radius:12px;font-weight:700;text-decoration:none;margin-bottom:10px}
.small{font-size:13px;color:#666;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="top">
<img src="logo.png" alt="MCRES">
<h1>MCRES ACADEMY</h1>
<p>Telugu Medium • Tests • Practice • Success</p>
</div>
<div class="card">
<h2>Welcome to MCRES Academy 👋</h2>
<a class="btn" href="login.html">Login →</a>
<a class="btn2" href="tests.html">📝 Test Series</a>
<a class="btn2" href="results.html">📊 My Results</a>
<a class="btn2" href="profile.html">👤 My Profile</a>
<p class="small">Guest గా కూడా Test రాయవచ్చు</p>
</div>

<script>
// MCRES Academy - Service Worker Registration
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./sw.js", { scope: "./" })
      .then((reg) => {
        console.log("MCRES SW Registered:", reg.scope);
        // కొత్త Version వస్తే Check చేయి
        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener("statechange", () => {
              if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                console.log("New MCRES version available - reload to update");
              }
            });
          }
        });
      })
      .catch((err) => {
        console.log("MCRES SW Register Failed:", err);
      });
  });
}
</script>
</body>
</html>
