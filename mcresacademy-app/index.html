<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{background:linear-gradient(160deg,#4a1d9e 0%,#6d28d9 35%,#7c3aed 60%,#3b1d8f 100%);min-height:100vh;padding:16px;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 15% 20%, rgba(255,255,255,.22) 0 45px, transparent 46px),radial-gradient(circle at 88% 12%, rgba(255,255,255,.18) 0 70px, transparent 71px),radial-gradient(circle at 85% 65%, rgba(255,255,255,.14) 0 55px, transparent 56px),radial-gradient(circle at 8% 75%, rgba(255,255,255,.12) 0 65px, transparent 66px),radial-gradient(circle at 50% 95%, rgba(255,255,255,.10) 0 90px, transparent 91px)}
.top{max-width:480px;margin:0 auto;text-align:center;color:#fff;padding:20px 0 8px;position:relative;z-index:1}
.top img{width:92px;border-radius:22px;background:#fff;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.9)}
.top h1{font-size:33px;margin:16px 0 8px;letter-spacing:1px;font-weight:900;line-height:1.1;color:#ffc400;-webkit-text-stroke:1px #ff9d00;text-shadow:0 1px 0 #ff9d00,0 2px 0 #ff8a00,0 3px 0 #f07c00,0 4px 0 #e06e00,0 5px 0 #c95f00,0 6px 0 #b35500,0 7px 2px rgba(0,0,0,.25),0 12px 22px rgba(0,0,0,.45)}
.tagline{display:inline-block;margin:0 0 10px;padding:6px 20px;font-size:16px;font-weight:900;letter-spacing:1.5px;font-style:italic;color:#fff;background:linear-gradient(90deg,#ff7b00,#ff2d55,#7c3aed);border-radius:999px;box-shadow:0 8px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 4px rgba(0,0,0,.35)}
.about{font-size:13.5px;line-height:1.55;color:#fff;margin:0 12px 10px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.about b{color:#ffe135}
.founder{margin:12px auto 0;max-width:400px;background:linear-gradient(180deg,#ffffff,#fff7d6);border:2px solid #ffc400;border-radius:18px;padding:12px 12px 13px;box-shadow:0 12px 24px rgba(0,0,0,.35), 0 4px 0 #ff9d00, inset 0 1px 0 #fff;font-size:13px;font-weight:800;letter-spacing:.5px;color:#4a1d9e;line-height:1.4;text-transform:uppercase}
.founder span{display:block;margin-top:3px;font-size:20px;font-weight:900;line-height:1.25;font-style:italic;letter-spacing:.2px;text-transform:none;background:linear-gradient(90deg,#ff7b00 0%,#ff2d55 30%,#7c3aed 60%,#00a8ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 2px 0 rgba(255,157,0,.25)) drop-shadow(0 3px 5px rgba(0,0,0,.20))}
.card{background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(214,203,255,.88));border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:18px 18px 20px;margin:14px auto;max-width:480px;box-shadow:0 20px 40px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.95);position:relative;z-index:1}
.card h2{color:#3b147e;font-size:17px;line-height:1.40;margin-bottom:14px;text-align:center;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.btn{display:block;text-align:center;background:linear-gradient(180deg,#ffe135 0%,#ffc400 30%,#ff9d00 65%,#ff7b00 100%);color:#fff;padding:15px;border-radius:16px;font-weight:800;font-size:18px;text-decoration:none;margin-bottom:14px;box-shadow:0 8px 18px rgba(255,157,0,.55), inset 0 2px 0 rgba(255,255,255,.75), inset 0 -3px 0 rgba(180,90,0,.25);text-shadow:0 1px 2px rgba(120,60,0,.35)}
.btn:active{transform:translateY(1px)}
.btn2{display:block;text-align:center;background:linear-gradient(180deg,#ffffff,#e9e7ff);color:#111;padding:14px;border-radius:16px;font-weight:700;font-size:17px;text-decoration:none;margin-bottom:12px;box-shadow:0 8px 16px rgba(59,20,126,.18), inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.9)}
.btn2:active{transform:translateY(1px)}
.btn2:last-child{margin-bottom:0}

</div>

</div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", { scope: "./" })
      .then((reg) => { console.log("MCRES SW Registered:", reg.scope); reg.addEventListener("updatefound", () => { const newWorker = reg.installing; if (newWorker) { newWorker.addEventListener("statechange", () => { if (newWorker.state === "installed" && navigator.serviceWorker.controller) { console.log("New MCRES version available - reload to update"); } }); } }); })
      .catch((err) => { console.log("MCRES SW Register Failed:", err); });
  });
}
</script>
