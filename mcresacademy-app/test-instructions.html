<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Exam - MCRES ACADEMY | Aspire - Achieve</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Arial,sans-serif}
body{background:#f5f0ff;padding:12px;padding-bottom:20px;color:#222}
.header{max-width:720px;margin:0 auto;background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.06);position:sticky;top:12px;z-index:10}
.header b{font-size:14px;color:#0d7a6b;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{background:#ff1744;color:#fff;font-weight:800;font-size:15px;padding:8px 12px;border-radius:20px;white-space:nowrap}
.timer.warn{background:#ff8703}
.wrap{max-width:720px;margin:12px auto;display:flex;flex-direction:column;gap:12px}
.qcard{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.qcard .qno{font-size:12px;font-weight:800;color:#670f9e}
.qcard h2{font-size:16px;line-height:1.5;margin:8px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f8f5ff;border:2px solid #eee;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;font-size:14.5px;line-height:1.5;font-family:inherit}
.opt.sel{background:#e8f5e9;border-color:#4caf50}
.opt span{font-weight:800;color:#670f9e}
.opt.sel span{color:#2e7d32}
.btnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{flex:1;border:0;padding:12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;min-width:110px}
.bPrev{background:#eee;color:#333}.bNext{background:#670f9e;color:#fff}.bMark{background:#2196f3;color:#fff}.bClear{background:#fff;border:1px solid #ddd;color:#333}
.palette{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.palette h3{font-size:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.pbtn{aspect-ratio:1;border-radius:50%;border:2px solid #ddd;background:#f5f5f5;font-weight:800;font-size:13px;cursor:pointer}
.pbtn.cur{outline:3px solid #670f9e;outline-offset:1px}
.pAnswered{background:#e8f5e9;border-color:#4caf50;color:#2e7d32}
.pNotAns{background:#fff3e0;border-color:#ff9800;color:#e65100}
.pMarked{background:#e3f2fd;border-color:#2196f3;color:#1565c0}
.pAnsMarked{background:#f3e5f5;border-color:#9c27b0;color:#6a1b9a}
.legend{font-size:12.5px;color:#666;line-height:1.7;margin-top:12px}
.submitBtn{display:block;width:100%;background:#ff8703;color:#fff;border:0;padding:15px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;margin-top:4px}
.result{background:#fff;border-radius:16px;padding:22px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.result h2{color:#0d7a6b;font-size:22px}
.result .score{font-size:42px;font-weight:900;color:#670f9e;margin:10px 0}
.result p{font-size:14px;line-height:1.7;color:#555}
.review{text-align:left;margin-top:16px}
.review div{border-top:1px solid #eee;padding:12px 0;font-size:13.5px;line-height:1.6}
.review b{color:#111}
.correct{color:#2e7d32;font-weight:700}.wrong{color:#c62828;font-weight:700}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:400px;width:100%;text-align:center}
.modal h3{font-size:18px;margin-bottom:10px}.modal p{font-size:14px;line-height:1.6;color:#555}
.modal button{margin-top:12px;padding:12px 18px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.mYes{background:#ff1744;color:#fff}.mNo{background:#eee;color:#333;margin-left:8px}
.footer{max-width:720px;margin:18px auto 0;text-align:center;font-size:12px;color:#777;line-height:1.6}
</style>
</head>
<body>
<div class="header"><b id="examTitle">MCRES ACADEMY - Exam</b><span class="timer" id="timer">--:--:--</span></div>
<div class="wrap" id="wrap">
<div class="qcard" id="qcard"></div>
<div class="palette">
<h3>Question Palette</h3>
<div class="grid" id="palette"></div>
<div class="legend">🟢 Answered &nbsp; 🟠 Not Answered &nbsp; ⚪ Not Visited &nbsp; 🔵 Marked &nbsp; 🟣 Answered & Marked<br><span style="color:#888">Note: Demo - Frontend only. Real marks / timer will be verified by Backend.</span></div>
</div>
<button class="submitBtn" id="submitBtn">Submit Test →</button>
</div>
<div class="modalBg" id="modal"><div class="modal"><h3>Submit Test?</h3><p id="modalText"></p><button class="mYes" id="confirmSubmit">Yes, Submit</button><button class="mNo" id="cancelSubmit">Cancel</button></div></div>
<div class="footer"><b>MCRES ACADEMY - Aspire - Achieve</b><br>An educational programme by MCRES</div>
<script>
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function validInt(raw,def,min,max){const n=Number(raw);if(!Number.isFinite(n)||!Number.isInteger(n)||n<min||n>max) return def;return n;}
function validFloat(raw,def,min,max){const n=Number(raw);if(!Number.isFinite(n)||n<min||n>max) return def;return n;}
const p=new URLSearchParams(location.search);
const tName=(p.get("test")||"Demo Test").slice(0,100);
const totalQ=validInt(p.get("q"),10,1,1000);
const totalMarks=validInt(p.get("marks"),10,1,1000);
const timeMin=validInt(p.get("time"),10,1,600);
const neg=validFloat(p.get("neg"),-0.25,-2,0);
const perRaw=p.get("per");
const per=perRaw===null?null:validFloat(perRaw,null,0.25,10);
// Demo questions - real questions will come from Backend / Admin
const demo=[
{q:"భారతదేశ రాజధాని ఏది?",o:["ముంబై","న్యూఢిల్లీ","కోల్‌కతా","చెన్నై"],a:1},
{q:"తెలంగాణ రాష్ట్రం ఎప్పుడు ఏర్పడింది?",o:["2013","2014","2015","2016"],a:1},
{q:"గోదావరి నది ఎక్కడ పుడుతుంది?",o:["త్రయంబకేశ్వర్","నాసిక్","అమరకంటక్","మహాబలేశ్వర్"],a:0},
{q:"భారత జాతీయ జంతువు ఏది?",o:["ఏనుగు","సింహం","బెంగాల్ పులి","జింక"],a:2},
{q:"Which is the largest planet?",o:["Mars","Venus","Jupiter","Saturn"],a:2},
{q:"Water formula?",o:["CO2","H2O","O2","NaCl"],a:1},
{q:"తెలంగాణలో ప్రసిద్ధ చార్మినార్ ఎక్కడ ఉంది?",o:["వరంగల్","హైదరాబాద్","కరీంనగర్","నిజామాబాద్"],a:1},
{q:"2 + 2 × 3 = ?",o:["12","8","10","6"],a:1},
{q:"Indian Constitution came into force on?",o:["15 Aug 1947","26 Jan 1950","26 Nov 1949","2 Oct 1950"],a:1},
{q:"Which river is called Dakshina Ganga?",o:["Krishna","Kaveri","Godavari","Tungabhadra"],a:2},
];
const questions=[];
for(let i=0;i<totalQ;i++){const d=demo[i%demo.length];questions.push({q:d.q+` (Q${i+1})`,o:d.o,a:d.a});}
document.getElementById("examTitle").textContent=tName+" • "+totalQ+" Q";
// Timer - End Time persisted, Refresh does NOT restart
const key="mcres_end_"+tName.replace(/\W/g,"_");
let endTime=Number(localStorage.getItem(key));
if(!endTime||endTime<Date.now()){endTime=Date.now()+timeMin*60*1000;localStorage.setItem(key,String(endTime));}
let cur=0;
let answers=new Array(totalQ).fill(null); // null = not answered
let visited=new Array(totalQ).fill(false);
let marked=new Array(totalQ).fill(false);
let submitted=false;
visited[0]=true;
function status(i){
if(marked[i]&&answers[i]!==null) return "pAnsMarked";
if(marked[i]) return "pMarked";
if(answers[i]!==null) return "pAnswered";
if(visited[i]) return "pNotAns";
return "";
}
function renderQ(){
const q=questions[cur];
document.getElementById("qcard").innerHTML=`
<div class="qno">Question ${cur+1} of ${totalQ}</div>
<h2>${esc(q.q)}</h2>
${q.o.map((opt,i)=>`<button class="opt ${answers[cur]===i?"sel":""}" onclick="selectOpt(${i})"><span>${"ABCD"[i]}.</span> ${esc(opt)}</button>`).join("")}
<div class="btnRow">
<button class="btn bPrev" onclick="goPrev()">← Previous</button>
<button class="btn bMark" onclick="toggleMark()">${marked[cur]?"Unmark":"Mark for Review"} ★</button>
<button class="btn bClear" onclick="clearAns()">Clear</button>
<button class="btn bNext" onclick="goNext()">Next →</button>
</div>`;
renderPalette();
}
function renderPalette(){
document.getElementById("palette").innerHTML=questions.map((_,i)=>`<button class="pbtn ${status(i)} ${i===cur?"cur":""}" onclick="jump(${i})">${i+1}</button>`).join("");
}
function selectOpt(i){answers[cur]=i;renderQ();}
function clearAns(){answers[cur]=null;renderQ();}
function toggleMark(){marked[cur]=!marked[cur];renderQ();}
function goPrev(){if(cur>0){cur--;visited[cur]=true;renderQ();}}
function goNext(){if(cur<totalQ-1){cur++;visited[cur]=true;renderQ();}}
function jump(i){cur=i;visited[i]=true;renderQ();}
function counts(){
let a=0,na=0,nv=0,m=0,am=0;
for(let i=0;i<totalQ;i++){
const s=status(i);
if(s==="pAnsMarked")am++; else if(s==="pMarked")m++; else if(s==="pAnswered")a++; else if(s==="pNotAns")na++; else nv++;
}
return {a,na,nv,m,am};
}
function tick(){
if(submitted) return;
const left=endTime-Date.now();
if(left<=0){doSubmit();return;}
const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);
const t=document.getElementById("timer");
t.textContent=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
t.classList.toggle("warn",left<5*60*1000);
}
setInterval(tick,1000);tick();renderQ();
document.getElementById("submitBtn").addEventListener("click",()=>{
const c=counts();
document.getElementById("modalText").textContent=`Answered: ${c.a+c.am} • Not Answered: ${c.na} • Not Visited: ${c.nv} • Marked: ${c.m+c.am}. Are you sure?`;
document.getElementById("modal").style.display="flex";
});
document.getElementById("cancelSubmit").addEventListener("click",()=>{document.getElementById("modal").style.display="none";});
document.getElementById("confirmSubmit").addEventListener("click",()=>{document.getElementById("modal").style.display="none";doSubmit();});
function doSubmit(){
if(submitted) return; submitted=true;
localStorage.removeItem(key);
let correct=0,wrong=0,attempted=0;
let perMark=per!==null?per:(totalMarks/totalQ);
questions.forEach((q,i)=>{if(answers[i]!==null){attempted++;if(answers[i]===q.a)correct++;else wrong++;}});
let score=correct*perMark + wrong*neg;
score=Math.max(0,Math.round(score*100)/100);
const c=counts();
document.getElementById("wrap").innerHTML=`
<div class="result"><h2>✅ Test Submitted!</h2><div class="score">${score} / ${totalMarks}</div>
<p><b>${esc(tName)}</b><br>Correct: ${correct} • Wrong: ${wrong} • Attempted: ${attempted} / ${totalQ}<br>Correct: ${per!==null?"+ "+per+" Mark":"As per Question Paper"} • Wrong: ${neg} Mark<br><span style="color:#888;font-size:12px">Demo Evaluation - Frontend only. Final result will be verified by Backend.</span></p>
<div class="review">${questions.slice(0,Math.min(totalQ,10)).map((q,i)=>{let st=answers[i]===null?"Not Attempted":(answers[i]===q.a?'<span class="correct">Correct ✓</span>':'<span class="wrong">Wrong ✗</span>');return `<div><b>Q${i+1}.</b> ${esc(q.q)}<br>Your Answer: ${answers[i]===null?"-":esc(q.o[answers[i]])} • Correct: ${esc(q.o[q.a])} • ${st}</div>`}).join("")}</div>
<button class="submitBtn" onclick="location.href='tests.html'">← Back to Tests</button></div>`;
window.scrollTo(0,0);
}
</script>
</body>
</html>
