<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>మాక్ టెస్ట్ 1</title><style>body{margin:0;background:#e6eef8;font-family:system-ui}header{background:#1e40af;color:#fff;padding:12px;text-align:center;position:sticky;top:0}.wrap{max-width:800px;margin:auto;padding:10px}.card{background:#fff;border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}.q{font-weight:700;font-size:14px}.opt{border:1.5px solid #ddd;border-radius:8px;padding:9px;margin:6px 0;background:#fafafa;font-size:13px;cursor:pointer}.opt.correct{background:#dcfce7;border-color:#16a34a}.opt.wrong{background:#fee2e2;border-color:#dc2626}.btn{background:#1e40af;color:#fff;border:none;padding:14px;width:100%;border-radius:10px;font-size:16px;font-weight:800}</style></head><body><header><h1>మాక్ టెస్ట్ 1 - 12 Oct</h1><p>25 ప్రశ్నలు | FREE</p></header><div class="wrap" id="root"></div><button class="btn" onclick="submitTest()">SUBMIT TEST</button><div id="res" style="text-align:center;padding:15px;font-weight:700"></div><script>const Q=[{q:"Q1. Congestion, Collision, Bottleneck, Breakdown - Matching?",o:["A. i-C, ii-B, iii-A, iv-D","B. i-A, ii-D, iii-ii, iv-C","C. i-D, ii-C, iii-iv-B","D. i-B, ii-A, iii-iv-C"],a:0},{q:"Q2. E,D,A,C,B - Streets wild - Order?",o:["A. EDACB","B. BACDE","C. DBACE","D. CBAED"],a:2},{q:"Q3. If you ___ hard, you ___ exam?",o:["A. Studied, will clear","B. Study, will clear","C. Had studied, would have cleared","D. Had studied, cleared"],a:2},{q:"Q4. Have your cake and eat it too - Meaning?",o:["A. Enjoy forever","B. Enjoy without payment","C. Have it both ways","D. Forgive guilt"],a:2},{q:"Q5. Children washed / their hands / after they played / with puppy - Error?",o:["A. washed","B. their hands","C. after they played","D. with puppy"],a:0}];for(let i=6;i<=25;i++){Q.push({q:`Q${i}. PDF నుండి Q${i} Paste చేయండి`,o:["A. Option 1","B. Option 2","C. Option 3","D. Option 4"],a:0})}const R=document.getElementById('root');let A={};Q.forEach((it,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<p class=q>${it.q}</p>`+it.o.map((o,j)=>`<div class=opt data-i=${i} data-j=${j}>${o}</div>`).join('');R.appendChild(d)});document.addEventListener('click',e=>{let el=e.target.closest('.opt');if(!el)return;A[el.dataset.i]=+el.dataset.j;el.parentElement.querySelectorAll('.opt').forEach(o=>o.style.background='#fafafa');el.style.background='#dbeafe'});function submitTest(){let s=0;Q.forEach((q,i)=>{let c=R.children[i];c.querySelectorAll('.opt').forEach((o,j)=>{if(j==q.a)o.classList.add('correct');if(A[i]!=undefined&&A[i]!=q.a&&j==A[i])o.classList.add('wrong')});if(A[i]==q.a)s++});document.getElementById('res').innerHTML=`Score: ${s}/25 - Next Test Tomorrow 6AM`;}</script></body></html>
