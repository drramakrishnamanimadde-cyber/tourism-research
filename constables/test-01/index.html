<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEST SERIES 01 - English 25 Q | MCRES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#eef3ff;-webkit-user-select:none;user-select:none}
.header{background:#0a1e7a;color:#fff;padding:16px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;min-height:78px;box-shadow:0 4px 14px rgba(0,0,0,0.3)}
.line1{color:#ffeb3b;font-size:13px;display:block;font-weight:900;margin-bottom:3px}
.line2{color:#fff;font-size:16.5px;display:block;font-weight:900;margin:3px 0;line-height:1.3}
.line3{color:#7ed6ff;font-size:12px;display:block;font-weight:700;margin-top:3px}
.timer{color:#ffeb3b;font-weight:900;font-size:18px;background:rgba(255,255,255,0.18);padding:8px 14px;border-radius:24px;border:2px solid rgba(255,235,59,0.4)}
.q-box{margin:14px 10px;background:#fff;border-radius:16px;padding:20px 16px;box-shadow:0 6px 18px rgba(0,0,0,0.12);border-left:8px solid #0a1e7a;min-height:52vh;position:relative;overflow:hidden}
.watermark-main{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-32deg);font-size:48px;font-weight:900;color:rgba(10,30,122,0.06);pointer-events:none;white-space:nowrap;z-index:0;letter-spacing:3px}
.watermark-sub{position:absolute;top:18%;left:10%;transform:rotate(-12deg);font-size:13px;font-weight:800;color:rgba(10,30,122,0.07);pointer-events:none;z-index:0}
.q-no,.q-text,#options{position:relative;z-index:1}
.q-no{color:#fff;padding:7px 14px;border-radius:22px;font-size:13px;font-weight:900;display:inline-block;margin-bottom:14px}
.q-text{font-size:17px;font-weight:800;line-height:1.75;margin-bottom:18px;white-space:pre-line}
.opt{border:2.5px solid #d1d5db;border-radius:14px;padding:15px 14px;margin:11px 0;display:flex;align-items:flex-start;gap:11px;cursor:pointer;font-size:15px;font-weight:700;line-height:1.5;position:relative;overflow:hidden}
.opt::after{content:"MCRES HYDERABAD";position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-10deg);font-size:10px;font-weight:900;color:rgba(0,0,0,0.05);pointer-events:none}
.opt:nth-child(1){background:#dbeafe;border-color:#60a5fa;color:#1e3a8a}
.opt:nth-child(2){background:#dcfce7;border-color:#4ade80;color:#14532d}
.opt:nth-child(3){background:#ffedd5;border-color:#fb923c;color:#7c2d12}
.opt:nth-child(4){background:#f3e8ff;border-color:#c084fc;color:#581c87}
.opt.selected{transform:scale(1.025);box-shadow:0 6px 16px rgba(0,0,0,0.18);border-width:3px;filter:brightness(0.9)}
.opt input{min-width:18px;min-height:18px;margin-top:4px}
.nav-box{margin:14px 10px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,0.1);position:relative;overflow:hidden}
.nav-box::before{content:"MCRES HYDERABAD";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);font-size:28px;font-weight:900;color:rgba(10,30,122,0.04);pointer-events:none;white-space:nowrap}
.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:10px;position:relative;z-index:1}
.nav-btn{padding:11px;border-radius:11px;border:2.2px solid #d1d5db;background:#fff;text-align:center;font-size:13.5px;font-weight:900;cursor:pointer}
.nav-btn.answered{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:#10b981}
.nav-btn.current{border-color:#ffeb3b;background:#0a1e7a;color:#fff;transform:scale(1.08);box-shadow:0 3px 10px rgba(0,0,0,0.3)}
.action-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:14px 12px;display:flex;gap:10px;box-shadow:0 -4px 20px rgba(0,0,0,0.15);z-index:999}
.action-bar button{flex:1;padding:15px;border:none;border-radius:14px;font-weight:900;font-size:14.5px}
#prevBtn{background:#e5e7eb;color:#111}
#nextBtn{background:linear-gradient(90deg,#0a1e7a,#3b82f6);color:#fff}
#submitBtn{background:linear-gradient(90deg,#dc2626,#ef4444);color:#fff;display:none}
</style>
</head>
<body oncontextmenu="return false">
<div class="header">
<div>
<span class="line1">MCRES - Mallaiah Center for River & Earth Sciences</span>
<span class="line2">TEST SERIES - 01 (English - 25 Q)</span>
<span class="line3">Founder & Director Dr. Ramakrishna Manimadde | mcres.in</span>
</div>
<div class="timer">⏱ <span id="timer">30:00</span></div>
</div>
<div class="q-box" id="qBoxMain">
<div class="watermark-main">MCRES HYDERABAD</div>
<div class="watermark-sub">Dr. Ramakrishna Manimadde - mcres.in</div>
<div class="q-no" id="qNo">Q 1 / 25</div>
<div class="q-text" id="qText"></div>
<div id="options"></div>
</div>
<div class="nav-box">
<h4 style="font-size:13px;color:#0a1e7a;font-weight:900;position:relative;z-index:1">📋 Question Navigation - Green = Answered, Blue = Current</h4>
<div class="nav-grid" id="navGrid"></div>
</div>
<div style="height:100px"></div>
<div class="action-bar">
<button id="prevBtn">← PREV</button>
<button id="nextBtn">NEXT →</button>
<button id="submitBtn" onclick="submitTest()">SUBMIT TEST</button>
</div>
<script>
document.addEventListener('keydown',e=>{
 if((e.ctrlKey && (e.key=='c' || e.key=='u' || e.key=='p' || e.key=='s' || e.key=='a')) || e.key=='F12' || (e.ctrlKey && e.shiftKey && (e.key=='I' || e.key=='J'))){e.preventDefault();return false}
});
document.addEventListener('copy',e=>e.preventDefault());
document.addEventListener('cut',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
const qColors=["#0a1e7a","#059669","#ea580c","#7e22ce","#b91c1c"];
const qBg=["linear-gradient(90deg,#0a1e7a,#3b82f6)","linear-gradient(90deg,#059669,#10b981)","linear-gradient(90deg,#ea580c,#fb923c)","linear-gradient(90deg,#7e22ce,#a855f7)","linear-gradient(90deg,#dc2626,#ef4444)"];
const questions=[
{ q:"1. Choose the correct matching of the words with their descriptions. (i) Congestion (ii) Collision (iii) Bottleneck (iv) Breakdown (A) An accident in which two vehicles hit each other (B) A situation in which roads are full of traffic (C) An occasion when a vehicle stops working (D) A place on a road where traffic cannot pass easily", o:["(i)-(C),(ii)-(B),(iii)-(A),(iv)-(D)","(i)-(A),(ii)-(D),(iii)-(B),(iv)-(C)","(i)-(D),(ii)-(C),(iii)-(A),(iv)-(B)","(i)-(B),(ii)-(A),(iii)-(D),(iv)-(C)"], a:3 },
{ q:"2. Choose the correct option to complete the sentence. If you had studied hard, you ____ the examination.", o:["Will clear","Would clear","Would have cleared","Cleared"], a:2 },
{ q:"3. Identify whether the sentence contains an error. The children (A) / washed their hands (B) / before they ate (C) / their lunch (D).", o:["Part (A)","Part (B)","Part (C)","No error"], a:3 },
{ q:"4. What does the idiom You cannot have your cake and eat it too mean?", o:["Enjoy forever","Enjoy without payment","Have it both ways","Forgive yourself of guilt"], a:2 },
{ q:"5. Arrange the words in the correct order to form a sentence. (a) travel (b) I (c) and (d) together (e) Satish", o:["b-c-e-d-a","e-c-b-a-d","e-c-b-d-a","b-c-e-a-d"], a:1 },
{ q:"6. The idiom to take a leaf out of someones book means:", o:["Steal something","Damage something","Cheat someone","Imitate someone or follow their example"], a:3 },
{ q:"7. The idiom to show someone the ropes means:", o:["Influence someone","Show someone how powerful you are","Hang someone","Teach someone how to do a job"], a:3 },
{ q:"8. Select the pair of synonymous words.", o:["Colloquial - Grammatical","Excess - Surplus","Fair - Strong","Alert - Inactive"], a:1 },
{ q:"9. What does the idiom They left no stone unturned to trace the culprits mean?", o:["Combed the whole area","Used all available means","Ransacked the place","Searched every corner"], a:1 },
{ q:"10. Choose the most appropriate words. The festival is a three-day-long celebration that combines ____ feasts with periods of ____ fasting.", o:["Unornamented, resolute","Paltry, obstinate","Scanty, parsimonious","Sumptuous, strict"], a:3 },
{ q:"11. Choose the correct sequence of articles. ____ uranium is ____ toxic metal. ____ uranium found in Australia accounts for 31 percent of ____ worlds known uranium ore reserves.", o:["No article, a, the, the","The, a, the, no article","No article, a, no article, the","The, the, no article, the"], a:0 },
{ q:"12. Tea may be used to ____ coffee.", o:["Compliment","Complementation","Complement","Complementary"], a:2 },
{ q:"13. What is the antonym of pious in the sentence She is a pious woman?", o:["Sweet","Famed","Ungodly","Cruel"], a:2 },
{ q:"14. Choose the synonym of amenable in the sentence Both parties were amenable to a peaceful settlement.", o:["Doubtful","Unwilling","Receptive","Disagreeable"], a:2 },
{ q:"15. Choose the synonym of antidote in the sentence Jogging is considered an antidote to mental stress.", o:["Poisonous substance","Remedy","Equivalent","Dangerous substance"], a:1 },
{ q:"16. What is the antonym of transparent in the sentence The window glass is transparent?", o:["Opaque","Translucent","Susceptible","Fragile"], a:0 },
{ q:"17. What is the antonym of unanimous in the sentence It was a unanimous decision?", o:["United","Divided","Compatible","Harmonious"], a:1 },
{ q:"18. Choose the correct articles. His mother was ____ American, though his father was ____ European.", o:["A, a","A, an","An, a","An, an"], a:2 },
{ q:"19. Choose the correct preposition. The coordinator was asked to attend ____ the issue and resolve it.", o:["By","In","To","No preposition required"], a:2 },
{ q:"20. Choose the correct verb. Either of the roads ____ to Vasantha Nagar.", o:["Lead","Leads","Have led","Are led"], a:1 },
{ q:"21. Choose the correct tense. Please dont disturb me; I ____ the coins now.", o:["Have been counting","Count","Was counting","Am counting"], a:3 },
{ q:"22. Choose the correct verb form. Rishi ____ his engineering course by the end of 2027.", o:["Will completed","Complete","Will have completed","Was completed"], a:2 },
{ q:"23. Choose the correctly spelt word.", o:["Occasional","Occassional","Ocassional","Occational"], a:0 },
{ q:"24. What does the expression put you up mean in the sentence We would be glad to put you up for a few days?", o:["Tolerate someone","Build something","Provide accommodation","Contribute something"], a:2 },
{ q:"25. Choose the correct question tag. Manoj played cricket for two days, ____?", o:["Did","Didnt","Wasnt","Wouldnt"], a:1 },
];
let cur=0, ans=new Array(25).fill(-1);
const grid=document.getElementById('navGrid');
questions.forEach((_,i)=>{
 let d=document.createElement('div');
 d.className='nav-btn'; d.textContent=i+1;
 d.onclick=()=>{cur=i;render();};
 grid.appendChild(d);
});
function render(){
 let group=Math.floor(cur/5);
 document.getElementById('qBoxMain').style.borderLeftColor=qColors[group];
 let qNoEl=document.getElementById('qNo');
 qNoEl.style.background=qBg[group];
 qNoEl.textContent='Q '+(cur+1)+' / 25 - SET '+(group+1)+' ('+['BLUE','GREEN','ORANGE','PURPLE','RED'][group]+')';
 let qTextEl=document.getElementById('qText');
 qTextEl.textContent=questions[cur].q;
 qTextEl.style.color=qColors[group];
 let optBox=document.getElementById('options');
 optBox.innerHTML='';
 questions[cur].o.forEach((op,i)=>{
   let div=document.createElement('div');
   div.className='opt'+(ans[cur]==i?' selected':'');
   div.innerHTML='<input type="radio" '+(ans[cur]==i?'checked':'')+'> <span>'+op+'</span>';
   div.onclick=()=>{ans[cur]=i;render();};
   optBox.appendChild(div);
 });
 document.getElementById('prevBtn').style.display=cur==0?'none':'block';
 document.getElementById('nextBtn').style.display=cur==24?'none':'block';
 document.getElementById('submitBtn').style.display=cur==24?'block':'none';
 document.querySelectorAll('.nav-btn').forEach((b,i)=>{
   b.className='nav-btn'+(ans[i]!=-1?' answered':'')+(i==cur?' current':'');
 });
}
document.getElementById('nextBtn').onclick=()=>{if(cur<24){cur++;render();window.scrollTo(0,0);}};
document.getElementById('prevBtn').onclick=()=>{if(cur>0){cur--;render();window.scrollTo(0,0);}};
let time=30*60;
setInterval(()=>{
 time--; let m=Math.floor(time/60), s=time%60;
 document.getElementById('timer').textContent=m+':'+(s<10?'0':'')+s;
 if(time<=0) submitTest();
},1000);
function submitTest(){
 let score=0;
 ans.forEach((a,i)=>{if(a==questions[i].a) score++;});
 let details='';
 questions.forEach((q,i)=>{
   let correct=q.o[q.a];
   let user=ans[i]==-1?'Not Attempted':q.o[ans[i]];
   let isCorrect=ans[i]==q.a;
   details+='<div style="text-align:left;background:'+(isCorrect?'#ecfdf5':'#fef2f2')+';border:2.5px solid '+(isCorrect?'#10b981':'#ef4444')+';border-radius:12px;padding:12px;margin:9px 0;font-size:13.5px"><b>Q'+(i+1)+':</b> '+(isCorrect?'✅':'❌')+' Your: '+user+'<br>Correct: '+correct+'</div>';
 });
 document.body.innerHTML='<div style="text-align:center;padding:22px;background:#fff;min-height:100vh"><h2 style="color:#0a1e7a">TEST SERIES 01 - Result</h2><div style="font-size:58px;font-weight:900;color:#0a1e7a;margin:18px 0">'+score+'/25</div><p><b>Correct:</b> '+score+' | <b>Wrong:</b> '+(ans.filter(a=>a!=-1).length-score)+' | <b>Not Attempted:</b> '+ans.filter(a=>a==-1).length+'</p><div style="margin-top:18px;max-height:60vh;overflow-y:auto">'+details+'</div><a href="../"><button style="margin-top:22px;background:#0a1e7a;color:#fff;padding:14px 32px;border:none;border-radius:14px;font-weight:900">Back to Tests</button></a><p style="margin-top:14px;color:#6b7280">MCRES Hyderabad - Protected</p></div>';
}
render();
</script>
</body>
</html>
