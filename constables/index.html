<!DOCTYPE html><html lang="te"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>మాక్ టెస్టులు</title><style>body{margin:0;background:#f1f5f9;font-family:system-ui}header{background:#1e40af;color:#fff;padding:14px;text-align:center} .wrap{max-width:900px;margin:auto;padding:12px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 4px rgba(0,0,0,.1);border-left:4px solid #1e40af} .card.lock{opacity:.5} .btn{display:block;background:#16a34a;color:#fff;text-align:center;padding:9px;border-radius:8px;text-decoration:none;margin-top:8px;font-weight:700} .btn.lock{background:#888}</style></head><body><header><h1>కానిస్టేబుల్ మాక్ టెస్టులు - 20 టెస్టులు</h1><p>25Q per Test | Oct FREE | Dec 20 Exam Target</p></header><div class="wrap"><div class="grid" id="g"></div></div><script>const s=new Date('2025-10-13'),g=document.getElementById('g'),t=new Date();t.setHours(0,0,0,0);for(let i=1;i<=20;i++){let d=new Date(s);d.setDate(s.getDate()+i-1);let live=t>=d,ds=d.toLocaleDateString('te-IN',{day:'2-digit',month:'short'});let c=document.createElement('div');c.className='card'+(live?'':' lock');c.innerHTML=`<b>మాక్ టెస్ట్ ${i}</b><br><small>25 ప్రశ్నలు • ${ds}</small>`+(live?`<a class="btn" href="test-${String(i).padStart(2,'0')}/">START 🔓</a>`:`<div class="btn lock">🔒 ${ds}</div>`);g.appendChild(c)}</script></body></html>
