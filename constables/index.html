<title>MCRES Constable Test Series - mcres.in</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#eef3ff;padding-bottom:230px}
.top-bar{background:#0f2d7a;color:#fff;text-align:center;padding:6px;font-size:9px;line-height:1.3}
.card-box{margin:8px;background:#fff;border:2px solid #ff8a3d;border-radius:12px;padding:8px}
.box-title{font-weight:800;font-size:12px;margin-bottom:8px}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g-item{border-radius:8px;padding:8px 6px;color:#fff;font-weight:800;text-decoration:none;display:block}
.g-item span{background:#fff;color:#000;font-size:9px;padding:1px 5px;border-radius:3px}
.g-item div{font-size:10px;margin-top:5px}
.g1{background:linear-gradient(135deg,#ff2d2d,#ff8c1a)} 
.g2{background:linear-gradient(135deg,#0d7c6e,#0fbfa0)} 
.g3{background:linear-gradient(135deg,#ff7a00,#ff9f0a)} 
.g4{background:linear-gradient(135deg,#0d7c6e,#0fbfa0)} 
.g5{background:linear-gradient(135deg,#ff7a00,#ff9f0a)}
