<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCRES Constables Mock Test 01</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;margin:0}
header{background:#1e293b;padding:14px;text-align:center;position:sticky;top:0}
header h1{margin:0;font-size:18px;color:#facc15}
.wrap{max-width:800px;margin:auto;padding:16px}
.q{background:#1e293b;border-radius:12px;padding:14px;margin:12px 0;border:1px solid #334155}
.q h3{margin:0 0 8px;font-size:13px;color:#facc15}
.opt{display:block;background:#0f172a;border:1px solid #334155;padding:8px 10px;border-radius:8px;margin:6px 0;cursor:pointer}
.opt.correct{background:#14532d;border-color:#22c55e}
.opt.wrong{background:#7f1d1d;border-color:#ef4444}
.score{position:fixed;bottom:0;left:0;right:0;background:#1e293b;padding:10px;text-align:center;border-top:1px solid #334155}
</style>
</head>
<body>
<header>
<h1>MCRES - Constables Mock Test 01 | 5 PDFs Mixed 25Q</h1>
<p>Prelims Q1-5 + Final Q1-5 (Official Key) + SI GS Q1-5 + Arithmetic Q1-5 + Culture Q1-5</p>
</header>
<div class="wrap" id="quiz"></div>
<div class="score" id="score">Score: 0 / 25</div>
<script>
const Q=[
{q:"Q1 Abandon Synonym - Prelims 2016 Q1",o:["Retain","Forsake","Support","Keep"],a:1},
{q:"Q2 He ___ to Hyd yesterday - Prelims Q2",o:["goes","went","has gone","will go"],a:1},
{q:"Q3 Antonym of Ancient - Q3",o:["Old","Modern","Past","Antique"],a:1},
{q:"Q4 One who knows many languages - Q4",o:["Polyglot","Bilingual","Linguist","Translator"],a:0},
{q:"Q5 She writes a letter Passive - Q5",o:["A letter is written by her","A letter was written","She is writing","Letter written"],a:0},
{q:"Q6 Synonym Diligent - Final 2016 Q1 Official",o:["Lazy","Hardworking","Careless","Idle"],a:1},
{q:"Q7 Synonym Courage - Final Q2",o:["Bravery","Fear","Cowardice","Timid"],a:0},
{q:"Q8 Synonym Honest - Final Q3",o:["Dishonest","Truthful","False","Cunning"],a:1},
{q:"Q9 Synonym Huge - Final Q4",o:["Tiny","Vast","Small","Little"],a:1},
{q:"Q10 Synonym Quick - Final Q5",o:["Slow","Fast","Late","Lazy"],a:1},
{q:"Q11 Protein deficiency - SI GS Q1",o:["Kwashiorkor","Anaemia","Rickets","Scurvy"],a:0},
{q:"Q12 Chlorophyll contains - Q2",o:["Magnesium","Iron","Calcium","Potassium"],a:0},
{q:"Q13 Taj Mahal built by - Q3",o:["Akbar","Shah Jahan","Jahangir","Humayun"],a:1},
{q:"Q14 Capital Telangana - Q4",o:["Warangal","Hyderabad","Khammam","Nizamabad"],a:1},
{q:"Q15 First President India - Q5",o:["Nehru","Rajendra Prasad","Gandhi","Patel"],a:1},
{q:"Q16 Divisible by 9 - Arithmetic Q1",o:["12345","23445","34515","12321"],a:2},
{q:"Q17 Avg 2,4,6,8,10 - Q2",o:["5","6","7","8"],a:1},
{q:"Q18 HCF 12,18 - Q3",o:["6","3","9","12"],a:0},
{q:"Q19 SP 500 Loss 20% CP? - Q4",o:["600","625","550","700"],a:1},
{q:"Q20 SI Formula - Q5",o:["PTR/100","P+R+T","P*T/R","P*R*T"],a:0},
{q:"Q21 Perini Dance region? - Culture",o:["Warangal Kakatiya","Hyderabad","Nalgonda","Adilabad"],a:0},
{q:"Q22 Sammakka Jatara - Culture",o:["Medaram","Warangal","Bhadrachalam","Yadagirigutta"],a:0},
{q:"Q23 Komaram Bheem tribe?",o:["Gond","Koya","Lambada","Chenchu"],a:0},
{q:"Q24 Bathukamma days?",o:["9 days","5 days","7 days","11 days"],a:0},
{q:"Q25 Bonalu Goddess?",o:["Mahakali","Saraswati","Lakshmi","Durga"],a:0},
];
let sc=0,at=0;const w=document.getElementById('quiz');
Q.forEach((it,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<h3>Q${i+1}/25</h3><p>${it.q}</p>`+it.o.map((o,j)=>`<div class=opt data-i=${i} data-j=${j}>${String.fromCharCode(65+j)}. ${o}</div>`).join('');w.appendChild(d);});
document.addEventListener('click',e=>{if(!e.target.classList.contains('opt'))return;const p=e.target.parentElement;if(p.dataset.done)return;p.dataset.done=1;const i=+e.target.dataset.i,j=+e.target.dataset.j;at++;if(j===Q[i].a){e.target.classList.add('correct');sc++;}else{e.target.classList.add('wrong');p.querySelectorAll('.opt')[Q[i].a].classList.add('correct');}document.getElementById('score').innerText=`Score: ${sc}/25 | Attempted: ${at}`;});
</script>
</body>
</html>
