<script>
const questions=[
{q:"Q1. 1969 తెలంగాణ ఉద్యమానికి ప్రధాన కారణం ఏమిటి?",opts:["ముల్కీ నిబంధనల ఉల్లంఘన - ఆంధ్ర ఉద్యోగుల నియామకం","భాషా వివక్ష - తెలుగు భాషను తొలగించడం","నీటి పంపకంలో అన్యాయం - కృష్ణా జలాల్లో 50% కోత","రాజధాని మార్పు - హైదరాబాద్ నుండి విజయవాడకు"],ans:0},
{q:"Q2. పెద్ద మనుషుల ఒప్పందం 1956 లో ఎన్ని అంశాలతో కుదిరింది?",opts:["8 అంశాలు - తెలంగాణకు ఉప ముఖ్యమంత్రి, మంత్రివర్గంలో 40%","5 అంశాలు - ఆంధ్రకు పూర్తి అధికారం","12 అంశాలు - మద్రాసు రాజధాని","15 అంశాలు - ఢిల్లీ రాజధాని"],ans:0},
{q:"Q3. ముల్కీ అంటే అర్థం ఏమిటి? ఎన్ని సంవత్సరాల నివాసం?",opts:["స్థానికుడు - 15 ఏళ్లు నిజాం రాష్ట్రంలో నివసించిన వారు","వలసదారు - 5 ఏళ్లు నివసించిన వారు","విదేశీయుడు - 20 ఏళ్లు నివసించిన వారు","రైతు - 10 ఏళ్లు వ్యవసాయం చేసిన వారు"],ans:0},
{q:"Q4. 1969 తెలంగాణ ప్రజా సమితి (TPS) ఎవరు స్థాపించారు? మొదటి అధ్యక్షుడు?",opts:["మర్రి చెన్నారెడ్డి - అధ్యక్షుడు - T. అంజయ్య ప్రధాన కార్యదర్శి","బూర్గుల రామకృష్ణారావు - అధ్యక్షుడు - రావి నారాయణ రెడ్డి","P.V. నరసింహారావు - అధ్యక్షుడు - జలగం వెంగళరావు","బద్దం ఎల్లారెడ్డి - అధ్యక్షుడు - మగ్దూం మొహియుద్దీన్"],ans:0},
{q:"Q5. హైదరాబాద్ సంస్థానం చివరి నిజాం ఎవరు?",opts:["మీర్ ఉస్మాన్ అలీ ఖాన్ - 7వ నిజాం - 1911-1948","మీర్ మహబూబ్ అలీ ఖాన్ - 6వ నిజాం","అఫ్జల్ ఉద్దౌలా - 5వ నిజాం","నాసిర్ ఉద్దౌలా - 4వ నిజాం"],ans:0},
{q:"Q6. ఆపరేషన్ పోలోలో భారత సైన్యాధిపతి ఎవరు?",opts:["మేజర్ జనరల్ J.N. చౌదరి - సర్దార్ పటేల్ ఆదేశంతో","జనరల్ కరియప్ప - నెహ్రూ ఆదేశంతో","జనరల్ మానేక్షా - ఇందిరా గాంధీ ఆదేశంతో","జనరల్ సుందర్ జీ - రాజీవ్ గాంధీ ఆదేశంతో"],ans:0},
{q:"Q7. 1969 తెలంగాణ ఉద్యమంలో తొలి ఆమరణ నిరాహార దీక్ష ఎవరు చేశారు? ఎక్కడ?",opts:["రవీంద్రనాథ్ - 1969 జనవరి 8 - ఖమ్మంలో - నాన్ ముల్కీ గో బ్యాక్","పొటు కృష్ణమూర్తి - 1969 జనవరి 10 - పాల్వంచలో","మర్రి చెన్నారెడ్డి - 1969 మార్చి 25 - హైదరాబాద్ లో","T. పురుషోత్తం రావు - 1969 జనవరి 12 - OU లో"],ans:0},
{q:"Q8. శ్రీకృష్ణ కమిటీలో ఎంత మంది సభ్యులు? చైర్మన్?",opts:["5 మంది - జస్టిస్ B.N. శ్రీకృష్ణ చైర్మన్ - 2010 ఫిబ్రవరి 3","3 మంది - జస్టిస్ రెడ్డి చైర్మన్","8 మంది - జస్టిస్ రావు చైర్మన్","11 మంది - జస్టిస్ శర్మ చైర్మన్"],ans:0},
{q:"Q9. సకల జనుల సమ్మెలో పాల్గొన్న ప్రధాన సంఘం ఏది?",opts:["TNGO's, TGO's, RTC, సింగరేణి కార్మికులు - 42 రోజులు","ఆంధ్ర NGO's - 10 రోజులు - విజయవాడ","కర్ణాటక NGO's - 5 రోజులు - బెంగళూరు","తమిళనాడు NGO's - 20 రోజులు - చెన్నై"],ans:0},
{q:"Q10. మిలియన్ మార్చ్ ప్రధాన డిమాండ్ ఏమిటి? ఎవరి నేతృత్వం?",opts:["తెలంగాణ బిల్లును పార్లమెంటులో ప్రవేశపెట్టాలి - TJAC - కోదండరామ్","సమైక్యాంధ్రను కొనసాగించాలి - సమైక్యాంధ్ర JAC","రాజధానిని విజయవాడకు మార్చాలి - AP NGO's","ఉద్యోగాల్లో 50% రిజర్వేషన్ - TNGO's"],ans:0},
{q:"Q11. 1956 పెద్ద మనుషుల ఒప్పందంలో తెలంగాణకు ఇచ్చిన ప్రధాన హామీ?",opts:["తెలంగాణ మిగులు ఆదాయం తెలంగాణకే - ఉప CM తెలంగాణ వాడే","ఆదాయం మొత్తం ఆంధ్రకు - CM ఆంధ్ర వాడే","హైదరాబాద్ ఆంధ్ర రాజధాని మాత్రమే","ఉద్యోగాలన్నీ ఆంధ్ర వారికే"],ans:0},
{q:"Q12. తెలంగాణ రాష్ట్ర బిల్లుకు రాష్ట్రపతి ఆమోదం ఎప్పుడు?",opts:["2014 మార్చి 1 - ప్రణబ్ ముఖర్జీ ఆమోదం","2014 జూన్ 2 - ప్రణబ్ ముఖర్జీ ఆమోదం","2013 డిసెంబర్ 1 - ప్రతిభా పాటిల్","2010 మార్చి 1 - APJ అబ్దుల్ కలాం"],ans:0},
{q:"Q13. 1956-2014 వరకు ఉమ్మడి AP లో తెలంగాణ ముఖ్యమంత్రులు?",opts:["3 మంది - మర్రి చెన్నారెడ్డి (2 సార్లు), P.V., జలగం వెంగళరావు","10 మంది - నీలం సంజీవరెడ్డి, కాసు బ్రహ్మానందరెడ్డి","1 మాత్రమే - ప్రకాశం పంతులు","6 మంది - చంద్రబాబు, YSR, రోశయ్య"],ans:0},
{q:"Q14. 1952 మొదటి ఎన్నికల్లో హైదరాబాద్ అసెంబ్లీ స్థానాలు?",opts:["175 స్థానాలు - కాంగ్రెస్ 93 - బూర్గుల CM","294 స్థానాలు - కాంగ్రెస్ 200 - నీలం సంజీవరెడ్డి","119 స్థానాలు - కాంగ్రెస్ 90 - P.V.","70 స్థానాలు - కాంగ్రెస్ 50 - మర్రి చెన్నారెడ్డి"],ans:0},
{q:"Q15. తెలంగాణ ఉద్యమంలో విద్యార్థుల పాత్ర ఎక్కడ నుండి ఎక్కువ?",opts:["ఉస్మానియా యూనివర్సిటీ - OU JAC - ఆర్ట్స్ కాలేజీ","ఆంధ్ర యూనివర్సిటీ - వైజాగ్ - సమైక్యాంధ్ర","మద్రాస్ యూనివర్సిటీ - చెన్నై - ద్రవిడ","ఢిల్లీ యూనివర్సిటీ - ఢిల్లీ"],ans:0},
{q:"Q16. OU JAC ఎప్పుడు ఏర్పడింది?",opts:["2009 - OU JAC - ఆర్ట్స్ కాలేజీ వేదిక","1969 - ఆంధ్ర యూనివర్సిటీ JAC","1956 - మద్రాస్ యూనివర్సిటీ JAC","2001 - కాకతీయ యూనివర్సిటీ JAC"],ans:0},
{q:"Q17. తెలంగాణ మార్టర్స్ మెమోరియల్ ఎక్కడ ఉంది?",opts:["గన్ పార్క్, హైదరాబాద్ - అసెంబ్లీ ఎదురుగా","ట్యాంక్ బండ్ - హుస్సేన్ సాగర్ మధ్యలో","చార్మినార్ - పాతబస్తీలో","గోల్కొండ - కోటపై"],ans:0},
{q:"Q18. 2009 డిసెంబర్ 9న తెలంగాణ ప్రక్రియ ప్రకటించిన హోం మంత్రి?",opts:["P. చిదంబరం - రాత్రి 11:30 గంటలకు","సుశీల్ కుమార్ షిండే - ఉదయం 11:30","రాజ్ నాథ్ సింగ్ - సాయంత్రం 5 గంటలకు","అమిత్ షా - మధ్యాహ్నం 2 గంటలకు"],ans:0},

const quizDiv=document.getElementById("quiz");
questions.forEach((qq,i)=>{
let cls=`q-card q${i+1} q${(i%6)+1}`;
let html=`<div class="${cls}" id="q${i}"><div class="q-head">${qq.q}</div><div class="options">`;
qq.opts.forEach((op,j)=>{
let letter=String.fromCharCode(65+j);
html+=`<label class="opt ${letter.toLowerCase()}" onclick="selectOpt(${i},${j},this)"><div class="ab">${letter}</div><div style="flex:1;">${op}</div><input type="radio" name="q${i}" value="${j}"></label>`;
});
html+=`</div></div>`;
quizDiv.innerHTML+=html;
});

function selectOpt(qi,oi,el){
let parent=document.getElementById(`q${qi}`);
parent.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
el.classList.add('selected');
el.querySelector('input').checked=true;
}

function submitQuiz(){
let score=0;
questions.forEach((qq,i)=>{
let sel=document.querySelector(`input[name="q${i}"]:checked`);
let box=document.getElementById(`q${i}`);
box.querySelectorAll('.opt').forEach((lab,idx)=>{
lab.classList.remove('correct','wrong');
if(idx===qq.ans) lab.classList.add('correct');
});
if(sel){
if(parseInt(sel.value)===qq.ans) score++;
else{
let wrongOpt=box.querySelectorAll('.opt')[sel.value];
if(!wrongOpt.classList.contains('correct')) wrongOpt.classList.add('wrong');
}
}
});
document.getElementById("result").innerHTML=`మీ స్కోర్: ${score} / ${questions.length} <br> జై తెలంగాణ!`;
window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}

// Timer
let time=36*60;
setInterval(()=>{
let m=Math.floor(time/60), s=time%60;
document.getElementById("timer").innerText=`⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
if(time>0) time--;
},1000);
</script>
