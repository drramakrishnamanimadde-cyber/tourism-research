<script>
const questions=[
{q:"1969 తెలంగాణ ఉద్యమానికి ప్రధాన కారణం ఏమిటి?",o:["ముల్కీ నిబంధనల ఉల్లంఘన - ఆంధ్ర ఉద్యోగుల నియామకం","భాషా వివక్ష - తెలుగు భాషను తొలగించడం","నీటి పంపకంలో అన్యాయం - కృష్ణా జలాల్లో 50% కోత","రాజధాని మార్పు - హైదరాబాద్ నుండి విజయవాడకు"],a:0},
{q:"పెద్ద మనుషుల ఒప్పందం 1956 లో ఎన్ని అంశాలతో కుదిరింది?",o:["8 అంశాలు - తెలంగాణకు ఉప ముఖ్యమంత్రి, మంత్రివర్గంలో 40%","5 అంశాలు - ఆంధ్రకు పూర్తి అధికారం","12 అంశాలు - మద్రాసు రాజధాని","15 అంశాలు - ఢిల్లీ రాజధాని"],a:0},
{q:"ముల్కీ అంటే అర్థం ఏమిటి? ఎన్ని సంవత్సరాల నివాసం?",o:["స్థానికుడు - 15 ఏళ్లు నిజాం రాష్ట్రంలో నివసించిన వారు","వలసదారు - 5 ఏళ్లు నివసించిన వారు","విదేశీయుడు - 20 ఏళ్లు నివసించిన వారు","రైతు - 10 ఏళ్లు వ్యవసాయం చేసిన వారు"],a:0},
{q:"1969 తెలంగాణ ప్రజా సమితి (TPS) ఎవరు స్థాపించారు? మొదటి అధ్యక్షుడు?",o:["మర్రి చెన్నారెడ్డి - అధ్యక్షుడు - T. అంజయ్య ప్రధాన కార్యదర్శి","బూర్గుల రామకృష్ణారావు - అధ్యక్షుడు - రావి నారాయణ రెడ్డి","P.V. నరసింహారావు - అధ్యక్షుడు - జలగం వెంగళరావు","బద్దం ఎల్లారెడ్డి - అధ్యక్షుడు - మగ్దూం మొహియుద్దీన్"],a:0},
{q:"హైదరాబాద్ సంస్థానం చివరి నిజాం ఎవరు?",o:["మీర్ ఉస్మాన్ అలీ ఖాన్ - 7వ నిజాం - 1911-1948","మీర్ మహబూబ్ అలీ ఖాన్ - 6వ నిజాం","అఫ్జల్ ఉద్దౌలా - 5వ నిజాం","నాసిర్ ఉద్దౌలా - 4వ నిజాం"],a:0},
{q:"ఆపరేషన్ పోలోలో భారత సైన్యాధిపతి ఎవరు?",o:["మేజర్ జనరల్ J.N. చౌదరి - సర్దార్ పటేల్ ఆదేశంతో","జనరల్ కరియప్ప - నెహ్రూ ఆదేశంతో","జనరల్ మానేక్షా - ఇందిరా గాంధీ ఆదేశంతో","జనరల్ సుందర్ జీ - రాజీవ్ గాంధీ ఆదేశంతో"],a:0},
{q:"1969 తెలంగాణ ఉద్యమంలో తొలి ఆమరణ నిరాహార దీక్ష ఎవరు చేశారు? ఎక్కడ?",o:["రవీంద్రనాథ్ - 1969 జనవరి 8 - ఖమ్మంలో - నాన్ ముల్కీ గో బ్యాక్","పొటు కృష్ణమూర్తి - 1969 జనవరి 10 - పాల్వంచలో","మర్రి చెన్నారెడ్డి - 1969 మార్చి 25 - హైదరాబాద్ లో","T. పురుషోత్తం రావు - 1969 జనవరి 12 - OU లో"],a:0},
{q:"శ్రీకృష్ణ కమిటీలో ఎంత మంది సభ్యులు? చైర్మన్?",o:["5 మంది - జస్టిస్ B.N. శ్రీకృష్ణ చైర్మన్ - 2010 ఫిబ్రవరి 3","3 మంది - జస్టిస్ రెడ్డి చైర్మన్","8 మంది - జస్టిస్ రావు చైర్మన్","11 మంది - జస్టిస్ శర్మ చైర్మన్"],a:0},
{q:"సకల జనుల సమ్మెలో పాల్గొన్న ప్రధాన సంఘం ఏది?",o:["TNGO's, TGO's, RTC, సింగరేణి కార్మికులు - 42 రోజులు","ఆంధ్ర NGO's - 10 రోజులు - విజయవాడ","కర్ణాటక NGO's - 5 రోజులు - బెంగళూరు","తమిళనాడు NGO's - 20 రోజులు - చెన్నై"],a:0},
{q:"మిలియన్ మార్చ్ ప్రధాన డిమాండ్ ఏమిటి? ఎవరి నేతృత్వం?",o:["తెలంగాణ బిల్లును పార్లమెంటులో ప్రవేశపెట్టాలి - TJAC - కోదండరామ్","సమైక్యాంధ్రను కొనసాగించాలి - సమైక్యాంధ్ర JAC","రాజధానిని విజయవాడకు మార్చాలి - AP NGO's","ఉద్యోగాల్లో 50% రిజర్వేషన్ - TNGO's"],a:0},
{q:"1956 పెద్ద మనుషుల ఒప్పందంలో తెలంగాణకు ఇచ్చిన ప్రధాన హామీ?",o:["తెలంగాణ మిగులు ఆదాయం తెలంగాణకే - ఉప CM తెలంగాణ","ఆదాయం మొత్తం ఆంధ్రకు - CM ఆంధ్ర","హైదరాబాద్ ఆంధ్ర రాజధాని మాత్రమే","ఉద్యోగాలన్నీ ఆంధ్ర వారికే"],a:0},
{q:"తెలంగాణ రాష్ట్ర బిల్లుకు రాష్ట్రపతి ఆమోదం ఎప్పుడు?",o:["2014 మార్చి 1 - ప్రణబ్ ముఖర్జీ ఆమోదం","2014 జూన్ 2 - ప్రణబ్ ముఖర్జీ ఆమోదం","2013 డిసెంబర్ 1 - ప్రతిభా పాటిల్","2010 మార్చి 1 - APJ అబ్దుల్ కలాం"],a:0},
{q:"1956-2014 వరకు ఉమ్మడి AP లో తెలంగాణ ముఖ్యమంత్రులు?",o:["3 మంది - మర్రి చెన్నారెడ్డి (2 సార్లు), P.V., జలగం","10 మంది - నీలం సంజీవరెడ్డి, కాసు బ్రహ్మానందరెడ్డి","1 మాత్రమే - ప్రకాశం పంతులు","6 మంది - చంద్రబాబు, YSR, రోశయ్య"],a:0},
{q:"1952 మొదటి ఎన్నికల్లో హైదరాబాద్ అసెంబ్లీ స్థానాలు?",o:["175 స్థానాలు - కాంగ్రెస్ 93 - బూర్గుల CM","294 స్థానాలు - కాంగ్రెస్ 200 - నీలం సంజీవరెడ్డి","119 స్థానాలు - కాంగ్రెస్ 90 - P.V.","70 స్థానాలు - కాంగ్రెస్ 50 - మర్రి చెన్నారెడ్డి"],a:0},
{q:"తెలంగాణ ఉద్యమంలో విద్యార్థుల పాత్ర ఎక్కడ నుండి ఎక్కువ?",o:["ఉస్మానియా యూనివర్సిటీ - OU JAC - ఆర్ట్స్ కాలేజీ","ఆంధ్ర యూనివర్సిటీ - వైజాగ్","మద్రాస్ యూనివర్సిటీ - చెన్నై","ఢిల్లీ యూనివర్సిటీ - ఢిల్లీ"],a:0},
{q:"OU JAC ఎప్పుడు ఏర్పడింది?",o:["2009 - OU JAC - ఆర్ట్స్ కాలేజీ వేదిక","1969 - ఆంధ్ర యూనివర్సిటీ JAC","1956 - మద్రాస్ యూనివర్సిటీ JAC","2001 - కాకతీయ యూనివర్సిటీ JAC"],a:0},
{q:"తెలంగాణ మార్టర్స్ మెమోరియల్ ఎక్కడ ఉంది?",o:["గన్ పార్క్, హైదరాబాద్ - అసెంబ్లీ ఎదురుగా","ట్యాంక్ బండ్ - హుస్సేన్ సాగర్ మధ్యలో","చార్మినార్ - పాతబస్తీలో","గోల్కొండ - కోటపై"],a:0},
{q:"2009 డిసెంబర్ 9న తెలంగాణ ప్రక్రియ ప్రకటించిన హోం మంత్రి?",o:["P. చిదంబరం - రాత్రి 11:30 గంటలకు","సుశీల్ కుమార్ షిండే - ఉదయం 11:30","రాజ్ నాథ్ సింగ్ - సాయంత్రం 5","అమిత్ షా - మధ్యాహ్నం 2"],a:0},
{q:"తెలంగాణ అమరవీరులకు అసెంబ్లీలో తీర్మానం ఎప్పుడు?",o:["1969 - తెలంగాణ అమరులకు నివాళి","1956 - ఆంధ్ర అమరులకు నివాళి","2001 - రాయలసీమ అమరులకు","2010 - కోస్తా అమరులకు"],a:0},
{q:"ఉమ్మడి AP లో చివరి ముఖ్యమంత్రి ఎవరు?",o:["N. కిరణ్ కుమార్ రెడ్డి - 2010-2014","Y.S. రాజశేఖర్ రెడ్డి - 2004-2009","చంద్రబాబు నాయుడు - 1995-2004","నీలం సంజీవరెడ్డి - 1956-1960"],a:0},

const quiz=document.getElementById("quiz");
questions.forEach((qq,i)=>{
let html=`<div class="qcard" id="q${i}"><div class="qhead"><b>Q${i+1}.</b> ${qq.q}</div><div class="opts">`;
qq.o.forEach((op,j)=>{
let L=["A","B","C","D"][j];
html+=`<label class="opt" data-l="${L}" onclick="sel(${i},${j},this)"><div class="ab">${L}</div><span>${op}</span><input type="radio" name="q${i}" value="${j}"></label>`;
});
html+=`</div></div>`;
quiz.innerHTML+=html;
});

function sel(qi,oi,el){
document.querySelectorAll(`#q${qi} .opt`).forEach(e=>e.classList.remove("sel"));
el.classList.add("sel");
el.querySelector("input").checked=true;
let done=document.querySelectorAll("input:checked").length;
document.getElementById("progressText").innerText=`${done}/24`;
document.getElementById("pbar").style.width=`${(done/24)*100}%`;
}

function submitQuiz(){
let score=0;
questions.forEach((qq,i)=>{
let s=document.querySelector(`input[name="q${i}"]:checked`);
let box=document.getElementById(`q${i}`);
box.querySelectorAll(".opt").forEach((lab,idx)=>{
lab.classList.remove("correct","wrong");
if(idx===qq.a) lab.classList.add("correct");
});
if(s){
if(parseInt(s.value)===qq.a) score++;
else{
let w=box.querySelectorAll(".opt")[s.value];
if(!w.classList.contains("correct")) w.classList.add("wrong");
}
}
});
let r=document.getElementById("result");
r.style.display="block";
r.innerHTML=`🎯 మీ స్కోర్: ${score} / 24 - ${score>=20?'Excellent! 🌟':score>=15?'Good Job! 👏':'Try Again! 💪'} <br><small style="font-weight:600;color:#6b7280;">జై తెలంగాణ! - MCRES</small>`;
window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
let t=36*60+39;
setInterval(()=>{let m=Math.floor(t/60),s=t%60;document.getElementById("timer").innerHTML=`⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} &nbsp;|&nbsp; <span id="progressText">${document.querySelectorAll("input:checked").length}/24</span>`; if(t>0) t--;},1000);
</script>
