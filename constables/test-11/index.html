{q:"Q1. 1969 తెలంగాణ ఉద్యమానికి ప్రధాన కారణం ఏమిటి?",options:["ముల్కీ నిబంధనల ఉల్లంఘన - ఆంధ్ర ఉద్యోగుల నియామకం","భాషా వివక్ష - తెలుగు భాషను తొలగించడం","నీటి పంపకంలో అన్యాయం - కృష్ణా జలాల్లో 50% కోత","రాజధాని మార్పు - హైదరాబాద్ నుండి విజయవాడకు"],ans:0},
{q:"Q2. పెద్ద మనుషుల ఒప్పందం 1956 లో ఎన్ని అంశాలతో కుదిరింది?",options:["8 అంశాలు - తెలంగాణకు ఉప ముఖ్యమంత్రి, మంత్రివర్గంలో 40%","5 అంశాలు - ఆంధ్రకు పూర్తి అధికారం","12 అంశాలు - మద్రాసు రాజధాని","15 అంశాలు - ఢిల్లీ రాజధాని"],ans:0},
{q:"Q3. ముల్కీ అంటే అర్థం ఏమిటి? ఎన్ని సంవత్సరాల నివాసం?",options:["స్థానికుడు - 15 ఏళ్లు నిజాం రాష్ట్రంలో నివసించిన వారు","వలసదారు - 5 ఏళ్లు నివసించిన వారు","విదేశీయుడు - 20 ఏళ్లు నివసించిన వారు","రైతు - 10 ఏళ్లు వ్యవసాయం చేసిన వారు"],ans:0},
{q:"Q4. 1969 తెలంగాణ ప్రజా సమితి (TPS) ఎవరు స్థాపించారు? మొదటి అధ్యక్షుడు?",options:["మర్రి చెన్నారెడ్డి - అధ్యక్షుడు - T. అంజయ్య ప్రధాన కార్యదర్శి - 1969 ఉద్యమానికి నేతృత్వం","బూర్గుల రామకృష్ణారావు - అధ్యక్షుడు - రావి నారాయణ రెడ్డి ప్రధాన కార్యదర్శి","P.V. నరసింహారావు - అధ్యక్షుడు - జలగం వెంగళరావు ప్రధాన కార్యదర్శి","బద్దం ఎల్లారెడ్డి - అధ్యక్షుడు - మగ్దూం మొహియుద్దీన్ ప్రధాన కార్యదర్శి"],ans:0},
{q:"Q5. హైదరాబాద్ సంస్థానం చివరి నిజాం ఎవరు?",options:["మీర్ ఉస్మాన్ అలీ ఖాన్ - 7వ నిజాం - 1911-1948 పాలన","మీర్ మహబూబ్ అలీ ఖాన్ - 6వ నిజాం","అఫ్జల్ ఉద్దౌలా - 5వ నిజాం","నాసిర్ ఉద్దౌలా - 4వ నిజాం"],ans:0},
{q:"Q6. ఆపరేషన్ పోలోలో భారత సైన్యాధిపతి ఎవరు?",options:["మేజర్ జనరల్ J.N. చౌదరి - సర్దార్ పటేల్ ఆదేశంతో","జనరల్ కరియప్ప - నెహ్రూ ఆదేశంతో","జనరల్ మానేక్షా - ఇందిరా గాంధీ ఆదేశంతో","జనరల్ సుందర్ జీ - రాజీవ్ గాంధీ ఆదేశంతో"],ans:0},
{q:"Q7. 1969 తెలంగాణ ఉద్యమంలో తొలి ఆమరణ నిరాహార దీక్ష ఎవరు చేశారు? ఎక్కడ?",options:["రవీంద్రనాథ్ - 1969 జనవరి 8 - ఖమ్మంలో - కవిరాజమూర్తితో కలిసి - నాన్ ముల్కీ గో బ్యాక్ నినాదం","పొటు కృష్ణమూర్తి - 1969 జనవరి 10 - పాల్వంచలో - ముల్కీ నిబంధనల కోసం","మర్రి చెన్నారెడ్డి - 1969 మార్చి 25 - హైదరాబాద్ లో - ప్రజా సమితి కోసం","T. పురుషోత్తం రావు - 1969 జనవరి 12 - ఉస్మానియా యూనివర్సిటీలో - విద్యార్థి JAC కోసం"],ans:0},
{q:"Q8. శ్రీకృష్ణ కమిటీలో ఎంత మంది సభ్యులు? చైర్మన్?",options:["5 మంది - జస్టిస్ B.N. శ్రీకృష్ణ చైర్మన్ - 2010 ఫిబ్రవరి 3","3 మంది - జస్టిస్ రెడ్డి చైర్మన్","8 మంది - జస్టిస్ రావు చైర్మన్","11 మంది - జస్టిస్ శర్మ చైర్మన్"],ans:0},
{q:"Q9. సకల జనుల సమ్మెలో పాల్గొన్న ప్రధాన సంఘం ఏది?",options:["TNGO's, TGO's, RTC, సింగరేణి కార్మికులు - 42 రోజులు","ఆంధ్ర NGO's - 10 రోజులు - విజయవాడ కేంద్రం","కర్ణాటక NGO's - 5 రోజులు - బెంగళూరు కేంద్రం","తమిళనాడు NGO's - 20 రోజులు - చెన్నై కేంద్రం"],ans:0},
{q:"Q10. మిలియన్ మార్చ్ ప్రధాన డిమాండ్ ఏమిటి? ఎవరి నేతృత్వం?",options:["తెలంగాణ బిల్లును పార్లమెంటులో ప్రవేశపెట్టాలి - TJAC - ప్రొఫెసర్ కోదండరామ్ నేతృత్వం","సమైక్యాంధ్రను కొనసాగించాలి - సమైక్యాంధ్ర JAC నేతృత్వం","రాజధానిని విజయవాడకు మార్చాలి - AP NGO's నేతృత్వం","ఉద్యోగాల్లో 50% రిజర్వేషన్ - TNGO's నేతృత్వం"],ans:0},
{q:"Q11. 1956 పెద్ద మనుషుల ఒప్పందంలో తెలంగాణకు ఇచ్చిన ప్రధాన హామీ ఏమిటి?",options:["తెలంగాణ ప్రాంత మిగులు ఆదాయం తెలంగాణ అభివృద్ధికే ఖర్చు చేయాలి - ఉప ముఖ్యమంత్రి తెలంగాణ వాడే","తెలంగాణ ఆదాయం మొత్తం ఆంధ్రకు తరలించాలి - ముఖ్యమంత్రి ఆంధ్ర వాడే","హైదరాబాద్ ను ఆంధ్ర రాజధానిగా మాత్రమే ఉంచాలి - తెలంగాణకు ఏ హామీ లేదు","ఉద్యోగాలన్నీ ఆంధ్ర వారికే ఇవ్వాలి - తెలంగాణకు ఏ కోటా లేదు"],ans:0},
{q:"Q12. తెలంగాణ రాష్ట్ర బిల్లుకు రాష్ట్రపతి ఆమోదం ఎప్పుడు?",options:["2014 మార్చి 1 - ప్రణబ్ ముఖర్జీ ఆమోదం - గెజిట్ నోటిఫికేషన్","2014 జూన్ 2 - ప్రణబ్ ముఖర్జీ ఆమోదం - గెజిట్ నోటిఫికేషన్","2013 డిసెంబర్ 1 - ప్రతిభా పాటిల్ ఆమోదం - గెజిట్ నోటిఫికేషన్","2010 మార్చి 1 - APJ అబ్దుల్ కలాం ఆమోదం - గెజిట్ నోటిఫికేషన్"],ans:0},
{q:"Q13. 1956-2014 వరకు ఉమ్మడి AP లో తెలంగాణ ముఖ్యమంత్రులు ఎంత మంది?",options:["3 మంది - మర్రి చెన్నారెడ్డి (2 సార్లు), P.V. నరసింహారావు, జలగం వెంగళరావు","10 మంది - నీలం సంజీవరెడ్డి, కాసు బ్రహ్మానందరెడ్డి, బెజవాడ గోపాలరెడ్డి","1 మాత్రమే - టంగుటూరి ప్రకాశం పంతులు","6 మంది - చంద్రబాబు నాయుడు, YSR, రోశయ్య, కిరణ్ కుమార్ రెడ్డి"],ans:0},
{q:"Q14. 1952 మొదటి ఎన్నికల్లో హైదరాబాద్ రాష్ట్ర అసెంబ్లీ స్థానాలు ఎన్ని?",options:["175 స్థానాలు - కాంగ్రెస్ 93 గెలుపు - బూర్గుల CM","294 స్థానాలు - కాంగ్రెస్ 200 గెలుపు - నీలం సంజీవరెడ్డి CM","119 స్థానాలు - కాంగ్రెస్ 90 గెలుపు - P.V. నరసింహారావు CM","70 స్థానాలు - కాంగ్రెస్ 50 గెలుపు - మర్రి చెన్నారెడ్డి CM"],ans:0},
{q:"Q15. తెలంగాణ ఉద్యమంలో విద్యార్థుల పాత్ర ఎక్కడ నుండి ఎక్కువ?",options:["ఉస్మానియా యూనివర్సిటీ - OU JAC - తెలంగాణ ఉద్యమానికి కేంద్రం - ఆర్ట్స్ కాలేజీ","ఆంధ్ర యూనివర్సిటీ - వైజాగ్ - సమైక్యాంధ్ర ఉద్యమానికి కేంద్రం","మద్రాస్ యూనివర్సిటీ - చెన్నై - ద్రవిడ ఉద్యమానికి కేంద్రం","ఢిల్లీ యూనివర్సిటీ - ఢిల్లీ - విద్యార్థి ఉద్యమానికి కేంద్రం"],ans:0},
{q:"Q16. తెలంగాణ ఉద్యమంలో ఉస్మానియా యూనివర్సిటీ విద్యార్థుల JAC ఎప్పుడు ఏర్పడింది?",options:["2009 - OU JAC - ఉస్మానియా క్యాంపస్ ఉద్యమానికి కేంద్ర బిందువు - ఆర్ట్స్ కాలేజీ వేదిక","1969 - ఆంధ్ర యూనివర్సిటీ JAC - వైజాగ్ క్యాంపస్ కేంద్రం","1956 - మద్రాస్ యూనివర్సిటీ JAC - చెన్నై క్యాంపస్ కేంద్రం","2001 - కాకతీయ యూనివర్సిటీ JAC - వరంగల్ క్యాంపస్ కేంద్రం"],ans:0},

const quizDiv=document.getElementById("quiz");
questions.forEach((qq,i)=>{
let html=`<div class="q" id="q${i}"><p>${qq.q}</p><div class="options">`;
qq.options.forEach((op,j)=>{
html+=`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}) ${op}</label>`;
});
html+=`</div></div>`;
quizDiv.innerHTML+=html;
});

function submitQuiz(){
let score=0;
questions.forEach((qq,i)=>{
let sel=document.querySelector(`input[name="q${i}"]:checked`);
let box=document.getElementById(`q${i}`);
box.querySelectorAll("label").forEach((lab,idx)=>{
lab.classList.remove("correct","wrong");
if(idx===qq.ans) lab.classList.add("correct");
});
if(sel){
if(parseInt(sel.value)===qq.ans) score++;
else box.querySelectorAll("label")[sel.value].classList.add("wrong");
}
});
document.getElementById("result").innerText=`మీ స్కోర్: ${score} / ${questions.length} - జై తెలంగాణ!`;
window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}
</script>
