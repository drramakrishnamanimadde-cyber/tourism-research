<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SI Prelims Grand Test | MCRES</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;background:#f0f2ff}
.header{padding:12px;text-align:center;background:#0f2a5a;color:#fff;font-weight:800}
.header span{font-size:12px;font-weight:400}
.container{max-width:800px;margin:14px auto;padding:14px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.btn{background:#16a34a;color:#fff;padding:12px 18px;border:none;border-radius:20px;font-weight:800;cursor:pointer;width:100%;font-size:16px}
.opt{border:1px solid #ddd;padding:12px;border-radius:10px;margin:8px 0;cursor:pointer;background:#f9fafb}
.opt.sel{background:#dbeafe;border-color:#2563eb}
.top{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0;font-size:15px;font-family:inherit}
</style>
</head>
<body>
<div class="header">SI PRELIMS GRAND TEST - 1<br><span>MCRES | Founder & Director - Dr Ramakrishna Manimadde</span></div>
<div class="container" id="app">
<h2 style="text-align:center">🏆 SI Prelims Grand Test - 1</h2>
<p style="text-align:center">Full Syllabus • 200 Questions • 200 Marks • Time: 180 Minutes</p>
<input id="sname" placeholder="మీ పేరు - Your Name">
<input id="sphone" placeholder="Phone Number">
<button class="btn" onclick="startTest()">Start Test →</button>
<p style="text-align:center;color:#666" id="status">Loading Questions from Supabase...</p>
</div>
<script>
const SUPABASE_URL = "https://eilhwxqlcufsgjnu.supabase.co";
const SUPABASE_KEY = "sb_publishable_0887bMu7tm9HOkxLzp0gDw_mmvTCF4P";
const TEST_ID = "SI-PRELIMS-GT-1";
let qs=[], cur=0, ans={}, timer=180*60, timerInt=null;
let studentName="", studentPhone="";
async function loadQs(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/mcres_questions?test_id=eq.${TEST_ID}&order=q_no.asc&limit=500`, {headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`}});
    qs = await res.json();
    if(!Array.isArray(qs) || qs.length===0){ document.getElementById('status').innerText = "Questions ఇంకా Add అవ్వలేదు"; return; }
    document.getElementById('status').innerText = qs.length + " Questions Loaded ✅ - పేరు రాసి Start Test నొక్కండి";
  }catch(e){ document.getElementById('status').innerText = "Error: Supabase Keys Check చేయండి"; }
}
loadQs();
function startTest(){
  if(!qs.length){ alert("Questions ఇంకా Load అవ్వలేదు"); return; }
  studentName = document.getElementById('sname').value.trim();
  studentPhone = document.getElementById('sphone').value.trim();
  if(!studentName){ alert("దయచేసి మీ పేరు రాయండి"); return; }
  if(timerInt) clearInterval(timerInt);
  timerInt=setInterval(()=>{ timer--; let m=Math.floor(timer/60), s=timer%60; let t=document.getElementById('timer'); if(t) t.innerText = m+":"+String(s).padStart(2,'0'); if(timer<=0) submitTest(); },1000);
  showQ();
}
function showQ(){
  let q=qs[cur]; let total = qs.length;
  document.getElementById('app').innerHTML = `<div class="top"><span>Q ${q.q_no} / ${total}</span><span id="timer">180:00</span></div><h3>${q.question_text}</h3><div class="opt ${ans[cur]=='A'?'sel':''}" onclick="pick('A',this)">A. ${q.option_a}</div><div class="opt ${ans[cur]=='B'?'sel':''}" onclick="pick('B',this)">B. ${q.option_b}</div><div class="opt ${ans[cur]=='C'?'sel':''}" onclick="pick('C',this)">C. ${q.option_c}</div><div class="opt ${ans[cur]=='D'?'sel':''}" onclick="pick('D',this)">D. ${q.option_d}</div><div style="display:flex;gap:10px;margin-top:14px"><button class="btn" style="background:#64748b" onclick="prevQ()">← Prev</button><button class="btn" onclick="nextQ()">Next →</button></div><button class="btn" style="background:#dc2626;margin-top:10px" onclick="submitTest()">Submit Test</button>`;
  let m=Math.floor(timer/60), s=timer%60; let t=document.getElementById('timer'); if(t) t.innerText = m+":"+String(s).padStart(2,'0');
}
function pick(v,el){ ans[cur]=v; document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); }
function nextQ(){ if(cur<qs.length-1){cur++; showQ();} }
function prevQ(){ if(cur>0){cur--; showQ();} }
async function saveResult(score){ try{ await fetch(`${SUPABASE_URL}/rest/v1/test_results`, {method:'POST', headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json', Prefer:'return=minimal'}, body: JSON.stringify({ student_name: studentName, student_phone: studentPhone, test_name: TEST_ID, marks: score, total: qs.length })}); }catch(e){} }
async function submitTest(){ clearInterval(timerInt); let score=0; qs.forEach((q,i)=>{ if(ans[i]==q.correct_option) score++; }); await saveResult(score); let html=`<h2>Result - SI Prelims GT-1</h2><h3>Score: ${score} / ${qs.length}</h3><p>${studentName} గారు, మీ Result Save అయింది ✅</p>`; qs.forEach((q,i)=>{ let u=ans[i]||"Not Answered"; html+=`<div style="border:1px solid #ddd;padding:10px;border-radius:10px;margin:8px 0"><b>Q${q.q_no}.</b> ${q.question_text}<br>Your Answer: ${u} | Correct: <b>${q.correct_option}</b><br>A. ${q.option_a}<br>B. ${q.option_b}<br>C. ${q.option_c}<br>D. ${q.option_d}</div>`; }); html+=`<a href="/" style="display:block;text-align:center;margin-top:14px">← Back to Home</a>`; document.getElementById('app').innerHTML=html; window.scrollTo(0,0); }
</script>
</body>
</html>
