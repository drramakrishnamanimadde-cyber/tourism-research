<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCRES Online Exams</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffffff;font-family:'Outfit',sans-serif;min-height:100vh}
.top{width:100%;background:#0f1a33;padding:14px 10px 16px;text-align:center}
.top .l1{color:#facc15;font-size:15px;font-weight:900;letter-spacing:.6px}
.top .l2{margin-top:10px;color:#e2e8f0;font-size:9.5px;font-weight:700;background:rgba(255,255,255,.12);display:block;padding:7px 10px;border-radius:16px;width:100%;max-width:360px;margin-left:auto;margin-right:auto}
.top .l3{margin-top:8px;display:block;background:#facc15;color:#0f172a;padding:6px 16px;border-radius:16px;font-size:10.5px;font-weight:800;width:fit-content;max-width:90%;margin-left:auto;margin-right:auto}
.bar{width:100%;background:#facc15;color:#0f172a;text-align:center;padding:8px;font-size:10px;font-weight:900;letter-spacing:1.2px}
.wrap{max-width:420px;margin:0 auto;padding:20px 14px;background:#ffffff}
.card{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:18px;margin-bottom:16px}
.c1{background:linear-gradient(145deg,#e0f2fe,#bae6fd);box-shadow:0 6px 0 #0ea5e9,0 12px 24px rgba(14,165,233,.30);border:1px solid #7dd3fc}
.c2{background:linear-gradient(145deg,#d1fae5,#a7f3d0);box-shadow:0 6px 0 #16a34a,0 12px 24px rgba(22,163,74,.30);border:1px solid #86efac}
.c3{background:linear-gradient(145deg,#fef9c3,#fde68a);box-shadow:0 6px 0 #eab308,0 12px 24px rgba(234,179,8,.35);border:1px solid #facc15}
.left{display:flex;align-items:center;gap:12px}
.icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.txt b{font-size:12.5px;color:#0f172a;font-weight:800;display:block}
.txt span{font-size:10px;color:#334155;font-weight:600;margin-top:2px;display:block}
.btn{border:none;padding:7px 16px;border-radius:18px;font-weight:800;font-size:10px;cursor:pointer}
.b2{background:#16a34a;color:#fff;box-shadow:0 3px 0 #15803d}
.b3{background:#0f172a;color:#facc15;box-shadow:0 3px 0 #020617}
.back{margin-top:10px;background:#0f172a;color:#facc15;text-align:center;padding:13px;border-radius:12px;font-weight:800;font-size:11px;cursor:pointer;box-shadow:0 4px 0 #020617}
</style>
</head>
<body>

<div class="top">
<div class="l1">MCRES Online Exams</div>
<div class="l2">MALLAIAH CENTER FOR RIVER & EARTH SCIENCES (MCRES)</div>
<div class="l3">Founder & Director Dr Ramakrishna Manimadde</div>
</div>

<div class="bar">CONSTABLE / SI - TESTS</div>

<div class="wrap">
<div class="card c1"><div class="left"><div class="icon">📘</div><div class="txt"><b>Constable Prelims</b><span>Syllabus & Exam Pattern</span></div></div></div>
<div class="card c2"><div class="left"><div class="icon">🏆</div><div class="txt"><b>Constable Grand Tests</b><span>6 Full Syllabus Tests</span></div></div><button class="btn b2" onclick="location.href='./grand-tests/'">View →</button></div>
<div class="card c3"><div class="left"><div class="icon">📝</div><div class="txt"><b>Constable Test Series</b><span>60 Chapter Wise Tests</span></div></div><button class="btn b3" onclick="location.href='./test-series/'">View →</button></div>
<div class="back" onclick="location.href='../'">← Back to Home</div>
</div>

</body>
</html>
