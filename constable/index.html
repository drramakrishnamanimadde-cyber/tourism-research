<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONSTABLE - PRELIMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f0f4f8}
.header{background:#0a1e5e;color:#ffeb3b;text-align:center;padding:16px;font-weight:800;font-size:16px;letter-spacing:1px;border-bottom:4px solid #ffeb3b}
.wrap{max-width:430px;margin:0 auto;padding:16px}
.title{background:#0a1e5e;color:#ffeb3b;padding:12px 16px;border-radius:10px;font-weight:700;margin:10px 0;display:flex;gap:8px;align-items:center}
.sub{background:#fff;padding:10px 14px;border-radius:10px;font-weight:600;border-left:5px solid #0a1e5e;margin-bottom:10px;font-size:14px}
.card{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.g{background:linear-gradient(135deg,#b8f5c8,#7ee89e)}
.y{background:linear-gradient(135deg,#fff1a6,#ffe26e)}
.ic{width:40px;height:40px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.txt{flex:1;margin-left:12px}
.txt b{font-size:14px;display:block;color:#111}
.txt span{font-size:12px;color:#333}
.btn{background:#fff;border:none;padding:7px 16px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.back{background:#0a1e5e;color:#ffeb3b;text-align:center;padding:14px;border-radius:12px;margin-top:30px;font-weight:700}
</style>
</head>
<body>
<div class="header">CONSTABLE / SI - TESTS</div>
<div class="wrap">
<div class="title">📘 PRELIMS</div>
<div class="sub">👮 Constable Prelims</div>

<div class="card g">
<div class="ic">🏆</div>
<div class="txt"><b>Constable Grand Tests</b><span>6 Tests</span></div>
<button class="btn" onclick="location.href='grand/'">View →</button>
</div>

<div class="card y">
<div class="ic">📚</div>
<div class="txt"><b>Constable Test Series</b><span>60 Tests</span></div>
<button class="btn" onclick="location.href='series/'">View →</button>
</div>

<div class="back" onclick="location.href='../'">← Back</div>
</div>
</body>
</html>
