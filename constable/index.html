<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCRES Online Exams</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffffff;font-family:'Outfit',sans-serif;min-height:100vh}
.top{background:linear-gradient(180deg,#1e2f5a 0%,#0f172a 100%);padding:18px 12px 22px;text-align:center}
.top .l1{color:#facc15;font-size:18px;font-weight:900;letter-spacing:.8px;text-shadow:0 2px 12px rgba(250,204,21,.5)}
.top .l2{margin-top:12px;color:#fff;font-size:11px;font-weight:700;line-height:1.4;background:rgba(255,255,255,.12);display:block;padding:8px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.15);max-width:340px;margin-left:auto;margin-right:auto}
.top .l3{margin-top:10px;display:block;background:linear-gradient(145deg,#facc15,#fde047);color:#0f172a;padding:8px 18px;border-radius:20px;font-size:11px;font-weight:800;max-width:320px;margin-left:auto;margin-right:auto;box-shadow:0 3px 0 #ca8a04}
.bar{background:#facc15;color:#0f172a;text-align:center;padding:9px;font-size:11px;font-weight:900;letter-spacing:1.5px}
.wrap{max-width:440px;margin:0 auto;padding:22px 16px;background:#fff}
.card{display:flex;align-items:center;justify-content:space-between;padding:18px;border-radius:18px;margin-bottom:20px;transition:.2s}
.card:active{transform:scale(.97) translateY(4px)}
.c1{background:#fff;box-shadow:0 7px 0 #cbd5e1,0 14px 28px rgba(0,0,0,.10);border:1px solid #e2e8f0}
.c2{background:linear-gradient(145deg,#dcfce7,#bbf7d0);box-shadow:0 7px 0 #16a34a,0 14px 28px rgba(22,163,74,.28);border:1px solid #86efac}
.c3{background:linear-gradient(145deg,#fef9c3,#fde68a);box-shadow:0 7px 0 #eab308,0 14px 28px rgba(234,179,8,.32);border:1px solid #facc15}
.left{display:flex;align-items:center;gap:13px}
.icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.10)}
.txt b{font-size:13.5px;color:#0f172a;font-weight:800;display:block}
.txt span{font-size:10.5px;color:#475569;font-weight:600;margin-top:3px;display:block}
.btn{border:none;padding:8px 18px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer}
.b2{background:#16a34a;color:#fff;box-shadow:0 4px 0 #15803d}
.b3{background:#0f172a;color:#facc15;box-shadow:0 4px 0 #020617}
.back{margin-top:10px;background:#0f172a;color:#facc15;text-align:center;padding:14px;border-radius:14px;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 5px 0 #020617}
</style>
</head>
<body>

<div class="top">
<div class="l1">MCRES Online Exams</div>
<div class="l2">MALLAIAH CENTER FOR RIVER & EARTH SCIENCES (MCRES)</div>
<div class="l3">Founder & Director Dr Ramakrishna Manimadde</div>
</div>

<div class="bar">CONSTABLE / SI - TESTS</div>

<div class="wrap">
<div class="card c1"><div class="left"><div class="icon">📘</div><div class="txt"><b>Constable Prelims</b><span>Syllabus & Exam Pattern</span></div></div></div>
<div class="card c2"><div class="left"><div class="icon">🏆</div><div class="txt"><b>Constable Grand Tests</b><span>6 Full Syllabus Tests</span></div></div><button class="btn b2" onclick="location.href='./grand-tests/'">View →</button></div>
<div class="card c3"><div class="left"><div class="icon">📝</div><div class="txt"><b>Constable Test Series</b><span>60 Chapter Wise Tests</span></div></div><button class="btn b3" onclick="location.href='./test-series/'">View →</button></div>
<div class="back" onclick="location.href='../'">← Back to Home</div>
</div>

</body>
</html>
