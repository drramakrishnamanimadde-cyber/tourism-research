<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCRES Online Exams</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffffff;font-family:'Outfit',sans-serif;min-height:100vh}
.top{background:linear-gradient(180deg,#1a2744 0%,#0f172a 100%);padding:20px 12px;text-align:center}
.top h1{color:#facc15;font-size:19px;font-weight:900;letter-spacing:.5px}
.top h2{color:#e2e8f0;font-size:10.5px;font-weight:700;margin-top:6px;line-height:1.4}
.top p{margin-top:10px;display:inline-block;background:#facc15;color:#0f172a;padding:5px 16px;border-radius:20px;font-size:11px;font-weight:800}
.bar{background:#facc15;color:#0f172a;text-align:center;padding:9px;font-size:11px;font-weight:900;letter-spacing:1.6px}
.wrap{max-width:440px;margin:0 auto;padding:22px 16px;background:#fff}
.card{display:flex;align-items:center;justify-content:space-between;padding:19px;border-radius:18px;margin-bottom:20px;transition:.2s}
.card:active{transform:scale(.97) translateY(4px)}
.c1{background:linear-gradient(145deg,#ffffff,#f8fafc);box-shadow:0 7px 0 #cbd5e1,0 14px 28px rgba(0,0,0,.10);border:1px solid #e2e8f0}
.c2{background:linear-gradient(145deg,#dcfce7,#bbf7d0);box-shadow:0 7px 0 #16a34a,0 14px 28px rgba(22,163,74,.28);border:1px solid #86efac}
.c3{background:linear-gradient(145deg,#fef9c3,#fde68a);box-shadow:0 7px 0 #eab308,0 14px 28px rgba(234,179,8,.30);border:1px solid #facc15}
.c1:active{box-shadow:0 2px 0 #cbd5e1}
.c2:active{box-shadow:0 2px 0 #16a34a}
.c3:active{box-shadow:0 2px 0 #eab308}
.left{display:flex;align-items:center;gap:13px}
.icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.10)}
.txt b{font-size:14px;color:#0f172a;font-weight:800;display:block}
.txt span{font-size:11px;color:#475569;font-weight:600;margin-top:3px;display:block}
.btn{border:none;padding:9px 20px;border-radius:22px;font-weight:800;font-size:11px;cursor:pointer}
.b2{background:#16a34a;color:#fff;box-shadow:0 4px 0 #15803d,0 8px 16px rgba(22,163,74,.35)}
.b3{background:#0f172a;color:#facc15;box-shadow:0 4px 0 #020617,0 8px 16px rgba(0,0,0,.3)}
.back{margin-top:10px;background:linear-gradient(145deg,#1e293b,#0f172a);color:#facc15;text-align:center;padding:15px;border-radius:16px;font-weight:800;font-size:12px;cursor:pointer;box-shadow:0 5px 0 #020617,0 12px 24px rgba(0,0,0,.25)}
.back:active{transform:translateY(4px);box-shadow:0 1px 0 #020617}
</style>
</head>
<body>
<div class="top">
<h1>MCRES Online Exams</h1>
<h2>MALLAIAH CENTER FOR RIVER & EARTH SCIENCES (MCRES)</h2>
<p>Founder & Director Dr Ramakrishna Manimadde</p>
</div>
<div class="bar">CONSTABLE / SI - TESTS</div>
<div class="wrap">
<div class="card c1"><div class="left"><div class="icon">📘</div><div class="txt"><b>Constable Prelims</b><span>Syllabus & Exam Pattern</span></div></div></div>
<div class="card c2"><div class="left"><div class="icon">🏆</div><div class="txt"><b>Constable Grand Tests</b><span>6 Full Syllabus Tests</span></div></div><button class="btn b2" onclick="location.href='./grand-tests/'">View →</button></div>
<div class="card c3"><div class="left"><div class="icon">📝</div><div class="txt"><b>Constable Test Series</b><span>60 Chapter Wise Tests</span></div></div><button class="btn b3" onclick="location.href='./test-series/'">View →</button></div>
<div class="back" onclick="location.href='../'">← Back to Home</div>
</div>
</body>
</html>
