<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCRES 3D - Constable Tests</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#eef4ff 0%,#e2e8f0 100%);font-family:'Inter',sans-serif;perspective:1000px;min-height:100vh}
.top{position:relative;background:radial-gradient(100% 150% at 30% -20%,#2a3f6b 0%,#1a2744 25%,#0f172a 60%,#020617 100%);padding:28px 16px 32px;text-align:center;transform-style:preserve-3d;box-shadow:0 20px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1)}
.top::before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 20%,rgba(250,204,21,.08) 40%,rgba(255,255,255,.05) 50%,transparent 60%);transform:translateZ(10px)}
.float{position:absolute;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(250,204,21,.15),transparent 70%);filter:blur(1px);animation:float 6s ease-in-out infinite}
.f1{top:10px;right:20px;animation-delay:0s}.f2{bottom:10px;left:10px;width:60px;height:60px;background:radial-gradient(circle,rgba(34,197,94,.12),transparent 70%);animation-delay:2s}
@keyframes float{0%,100%{transform:translateY(0) translateZ(20px)}50%{transform:translateY(-12px) translateZ(30px)}}
.top h1{position:relative;font-family:'Outfit',sans-serif;color:#facc15;font-size:22px;font-weight:900;letter-spacing:.5px;transform:translateZ(40px);text-shadow:0 2px 0 #a16207,0 4px 0 #854d0e,0 6px 15px rgba(0,0,0,.5),0 0 30px rgba(250,204,21,.4)}
.top h2{position:relative;color:#cbd5e1;font-size:11px;font-weight:600;margin-top:8px;letter-spacing:.8px;transform:translateZ(30px);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.top p{position:relative;margin-top:14px;display:inline-block;background:linear-gradient(145deg,#facc15,#fde047);color:#0f172a;padding:7px 18px;border-radius:24px;font-size:11px;font-weight:800;transform:translateZ(50px);box-shadow:0 4px 0 #ca8a04,0 8px 20px rgba(0,0,0,.3),0 0 0 1px rgba(250,204,21,.5);transition:.2s}
.top p:active{transform:translateZ(50px) translateY(2px);box-shadow:0 2px 0 #ca8a04,0 4px 12px rgba(0,0,0,.3)}
.bar{position:relative;background:linear-gradient(145deg,#facc15 0%,#fde047 50%,#eab308 100%);color:#0f172a;text-align:center;padding:10px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;box-shadow:0 4px 0 #ca8a04,0 10px 20px rgba(250,204,21,.3);transform:translateZ(20px);z-index:2}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px;transform-style:preserve-3d}
.card{position:relative;display:flex;align-items:center;justify-content:space-between;padding:20px;border-radius:20px;margin-bottom:18px;background:linear-gradient(145deg,#ffffff 0%,#f8fafc 100%);transform-style:preserve-3d;transition:all .35s cubic-bezier(.34,1.56,.64,1);cursor:pointer;transform:rotateX(2deg) translateZ(0)}
.card:hover{transform:rotateX(0deg) translateY(-4px) translateZ(20px)}
.c1{box-shadow:0 8px 0 #cbd5e1,0 16px 32px rgba(0,0,0,.12),inset 0 1px 0 #fff;border:1px solid #e2e8f0}
.c1:active{box-shadow:0 2px 0 #cbd5e1,0 6px 12px rgba(0,0,0,.12);transform:translateY(6px) rotateX(2deg)}
.c2{box-shadow:0 8px 0 #86efac,0 16px 32px rgba(34,197,94,.25),inset 0 1px 0 #fff;border:1px solid #bbf7d0}
.c2:active{box-shadow:0 2px 0 #86efac,0 6px 12px rgba(34,197,94,.25);transform:translateY(6px) rotateX(2deg)}
.c3{box-shadow:0 8px 0 #fde68a,0 16px 32px rgba(250,204,21,.28),inset 0 1px 0 #fff;border:1px solid #fde68a}
.c3:active{box-shadow:0 2px 0 #fde68a,0 6px 12px rgba(250,204,21,.28);transform:translateY(6px) rotateX(2deg)}
.left{display:flex;align-items:center;gap:14px;transform:translateZ(20px)}
.icon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;transform:translateZ(30px);position:relative;box-shadow:inset 0 2px 4px rgba(255,255,255,.8),inset 0 -2px 4px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.1)}
.i1{background:linear-gradient(145deg,#e2e8f0,#cbd5e1);box-shadow:0 4px 0 #94a3b8,inset 0 2px 0 #fff}
.i2{background:linear-gradient(145deg,#bbf7d0,#86efac);box-shadow:0 4px 0 #22c55e,inset 0 2px 0 #fff}
.i3{background:linear-gradient(145deg,#fef9c3,#fde68a);box-shadow:0 4px 0 #eab308,inset 0 2px 0 #fff}
.txt b{font-family:'Outfit',sans-serif;font-size:14.5px;color:#0f172a;font-weight:800;transform:translateZ(10px);text-shadow:0 1px 0 #fff}
.txt span{font-size:11px;color:#64748b;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:5px}
.btn{position:relative;border:none;padding:10px 22px;border-radius:26px;font-weight:900;font-size:12px;cursor:pointer;transform:translateZ(40px);transform-style:preserve-3d;transition:.15s;min-width:82px;letter-spacing:.3px}
.b2{background:linear-gradient(145deg,#22c55e,#16a34a);color:#fff;box-shadow:0 5px 0 #15803d,0 8px 16px rgba(22,163,74,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.b2:active{box-shadow:0 2px 0 #15803d,0 4px 8px rgba(22,163,74,.35);transform:translateZ(40px) translateY(3px)}
.b3{background:linear-gradient(145deg,#1e293b,#0f172a);color:#facc15;box-shadow:0 5px 0 #020617,0 8px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1)}
.b3:active{box-shadow:0 2px 0 #020617,0 4px 8px rgba(0,0,0,.3);transform:translateZ(40px) translateY(3px)}
.back{margin-top:10px;background:linear-gradient(145deg,#1e293b,#0f172a);color:#facc15;text-align:center;padding:16px;border-radius:18px;font-weight:800;font-size:12px;letter-spacing:.8px;cursor:pointer;box-shadow:0 6px 0 #020617,0 12px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1);transform:translateZ(10px);transition:.15s}
.back:active{box-shadow:0 2px 0 #020617,0 6px 12px rgba(0,0,0,.3);transform:translateY(4px)}
.live{transform:translateZ(10px);box-shadow:0 6px 0 #0f172a,0 12px 20px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="top">
<div class="float f1"></div><div class="float f2"></div>
<h1>MCRES On-line Exams</h1>
<h2>MALLAIAH CENTER FOR RIVER & EARTH SCIENCES</h2>
<p>👨‍🏫 Founder & Director Dr Ramakrishna Manimadde</p>
</div>
<div class="bar">◈ CONSTABLE / SI - 3D TESTS ◈</div>
<div class="wrap">
<div class="card c1"><div class="left"><div class="icon i1">📘</div><div class="txt"><b>Constable Prelims</b><span>📋 Syllabus & Pattern</span></div></div></div>
<div class="card c2"><div class="left"><div class="icon i2">🏆</div><div class="txt"><b>Grand Tests</b><span>🎯 6 Tests • 3D View</span></div></div><button class="btn b2" onclick="location.href='./grand-tests/'">View →</button></div>
<div class="card c3"><div class="left"><div class="icon i3">📝</div><div class="txt"><b>Test Series</b><span>🔥 60 Tests • 3D Mode</span></div></div><button class="btn b3" onclick="location.href='./test-series/'">View →</button></div>
<div class="back" onclick="location.href='../'">← Back to Home</div>
</div>
</body>
</html>
