<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONSTABLE - PRELIMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f6fb;font-family:system-ui,sans-serif}
.header{background:#1a2744;color:#facc15;text-align:center;padding:12px;font-weight:800;font-size:13px;letter-spacing:1px}
.wrap{max-width:430px;margin:0 auto;padding:16px}
.sub{background:#1a2744;color:#facc15;padding:8px 12px;border-radius:6px;font-weight:800;font-size:12px;margin-bottom:10px}
.card{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:12px;margin-bottom:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card .ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.card .txt{flex:1;margin-left:10px}
.card .txt b{font-size:13px;color:#1a2744;display:block}
.card .txt span{font-size:11px;color:#64748b}
.btn{border:none;background:#1a2744;color:#facc15;padding:7px 16px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer}
.g{background:linear-gradient(135deg,#f0fdf4,#fff);border-left:4px solid #16a34a}
.g .ic{background:#dcfce7}
.y{background:linear-gradient(135deg,#fefce8,#fff);border-left:4px solid #eab308}
.y .ic{background:#fef9c3}
.back{background:#1a2744;color:#facc15;text-align:center;padding:12px;border-radius:12px;margin-top:12px;font-weight:700;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<div class="header">CONSTABLE / SI - TESTS</div>
<div class="wrap">
<div class="sub">📘 PRELIMS</div>

<div class="card">
<div class="ic">📄</div>
<div class="txt"><b>Constable Prelims</b><span>Syllabus & Exam Pattern</span></div>
</div>

<div class="card g">
<div class="ic">🏆</div>
<div class="txt"><b>Constable Grand Tests</b><span>6 Tests</span></div>
<button class="btn" onclick="location.href='./grand-tests/'">View →</button>
</div>

<div class="card y">
<div class="ic">📝</div>
<div class="txt"><b>Constable Test Series</b><span>60 Tests</span></div>
<button class="btn" onclick="location.href='./test-series/'">View →</button>
</div>

<div class="back" onclick="location.href='../'">← Back</div>

</div>
</body>
</html>
