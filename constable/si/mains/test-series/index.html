<!DOCTYPE html>
<html>
<head>
<title>SI Mains TS - 60 Tests</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;padding:15px;background:#f8fafc}
.card{background:#fff;border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.view{background:#dcfce7;color:green;padding:6px 14px;border-radius:20px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<h2>SI Mains - Test Series (60 TS)</h2>
<div id="list"></div>
<br><a href="/">← Back</a>
<script>
const list=document.getElementById('list');
for(let i=1;i<=60;i++){
list.innerHTML+=`<div class="card"><span>TS-${i}</span><a class="view" href="#">View →</a></div>`;
}
</script>
</body>
</html>
