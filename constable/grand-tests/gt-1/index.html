<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT-1 Exam</title>
<style>
body{font-family:Arial;padding:15px;background:#f2f2f2}
.q{background:#fff;padding:15px;margin-bottom:12px;border-radius:10px}
button{padding:12px 20px;background:#0b5cff;color:#fff;border:none;border-radius:8px;font-size:16px;width:100%}
</style>
</head>
<body>
<h2>GT-1 Exam</h2>
<div id="box">Loading Questions...</div>
<button onclick="submitExam()">Submit Exam</button>
<h3 id="result"></h3>

<script>
const SUPABASE_URL = "https://eilhwxqlcufsgjnu.supabase.co";
const SUPABASE_KEY = "sb_publishable_0887bMu7tm9HOkxLzp0gDw_mmvTCF4P";
let questions = [];

async function loadQuestions(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/mcres_questions?select=*&test_id=eq.CONST-SI-GT-1&order=q_no.asc`, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    }
  });
  questions = await res.json();
  if(!questions || questions.length===0){
    document.getElementById("box").innerHTML = "Questions దొరకలేదు!";
    return;
  }
  let html = "";
  questions.forEach((q,i)=>{
    html += `<div class="q"><b>Q${q.q_no}. ${q.question}</b><br><br>
    <label><input type="radio" name="q${i}" value="A"> A. ${q.opt_a}</label><br>
    <label><input type="radio" name="q${i}" value="B"> B. ${q.opt_b}</label><br>
    <label><input type="radio" name="q${i}" value="C"> C. ${q.opt_c}</label><br>
    <label><input type="radio" name="q${i}" value="D"> D. ${q.opt_d}</label><br>
    </div>`;
  });
  document.getElementById("box").innerHTML = html;
}
function submitExam(){
  let score=0;
  questions.forEach((q,i)=>{
    let sel=document.querySelector(`input[name="q${i}"]:checked`);
    if(sel && sel.value===q.correct_opt) score++;
  });
  document.getElementById("result").innerText = `మీ Marks: ${score} / ${questions.length}`;
}
loadQuestions();
</script>
</body>
</html>
